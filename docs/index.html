<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>まとめ暗記 介護福祉士</title>
<meta name="description" content="介護福祉士国家試験の重要用語を、カード一覧で繰り返し見て覚える学習アプリ">
<meta name="theme-color" content="#1b5fb5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="まとめ暗記">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
html { color-scheme: light; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout: 片手操作前提の1カラム。主要操作は画面下部、用語は2列タイルで位置を固定 */
:root {
  /* 白と青を基調。緑（確認済み・正解）と赤（不正解）は意味のある所だけに使う */
  --bg: #ffffff;
  --surface: #ffffff;
  --tint: #f2f7fd;
  --ink: #13243b;
  --muted: #586a82;
  --faint: #8797ad;
  --line: #d9e4f2;
  --accent: #1b5fb5;
  --accent-ink: #ffffff;
  --accent-soft: #e7f0fb;
  --brand: #1b5fb5;
  --brand-ink: #ffffff;
  --brand-muted: #c9dcf5;
  --ok: #1d8a52;
  --ok-ink: #ffffff;
  --ok-soft: #eaf6ef;
  --ok-line: #9fd2b6;
  --ng: #c2412d;
  --ng-soft: #fcefec;
  --ng-line: #eab4aa;
  --scrim: rgba(13, 30, 56, 0.42);
  --shadow: none;
  --shadow-sheet: 0 -8px 28px rgba(13, 30, 56, 0.16);

  --font: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
  --fs-xs: 11px;
  --fs-sm: 12.5px;
  --fs-md: 14px;
  --fs-lg: 15.5px;
  --fs-xl: 19px;
  --radius: 12px;
  --radius-sm: 9px;
  --app-max: 480px;
  --tap: 44px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1626;
    --surface: #142036;
    --tint: #18273f;
    --ink: #e4ecf7;
    --muted: #9db0c9;
    --faint: #6f84a1;
    --line: #243652;
    --accent: #7fb0f0;
    --accent-ink: #0b1a2f;
    --accent-soft: #1a2d4a;
    --brand: #163a6b;
    --brand-ink: #ffffff;
    --brand-muted: #a8c4ea;
    --ok: #4ec58a;
    --ok-ink: #0d1f15;
    --ok-soft: #132b20;
    --ok-line: #2e6a4a;
    --ng: #f0806c;
    --ng-soft: #2e1a17;
    --ng-line: #6e3a31;
    --scrim: rgba(0, 0, 0, 0.6);
    --shadow: none;
    --shadow-sheet: 0 -8px 28px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1626;
  --surface: #142036;
  --tint: #18273f;
  --ink: #e4ecf7;
  --muted: #9db0c9;
  --faint: #6f84a1;
  --line: #243652;
  --accent: #7fb0f0;
  --accent-ink: #0b1a2f;
  --accent-soft: #1a2d4a;
  --brand: #163a6b;
  --brand-ink: #ffffff;
  --brand-muted: #a8c4ea;
  --ok: #4ec58a;
  --ok-ink: #0d1f15;
  --ok-soft: #132b20;
  --ok-line: #2e6a4a;
  --ng: #f0806c;
  --ng-soft: #2e1a17;
  --ng-line: #6e3a31;
  --scrim: rgba(0, 0, 0, 0.6);
  --shadow: none;
  --shadow-sheet: 0 -8px 28px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: var(--fs-md);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body.is-locked { overflow: hidden; }
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--surface);
}
button { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; line-height: 1.35; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app {
  max-width: var(--app-max);
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ---------- Top bar ---------- */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding-block: 8px 12px;
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  align-items: center;
  gap: 4px;
}
.topbar__titles { min-width: 0; flex: 1; }
.topbar__eyebrow {
  font-size: var(--fs-xs);
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar__title { font-size: var(--fs-lg); font-weight: 700; }
.icon-btn {
  flex: none;
  width: var(--tap);
  height: var(--tap);
  border: 0;
  background: none;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--ink);
  cursor: pointer;
}
.icon-btn:active { background: var(--accent-soft); }
.icon-btn svg { width: 24px; height: 24px; }

.content {
  flex: 1;
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.content--with-dock { padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px)); }

.section { display: flex; flex-direction: column; gap: 10px; }
.section__label {
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--muted);
}

/* ---------- Home ---------- */
.home-head { display: flex; flex-direction: column; gap: 4px; padding-top: 8px; }
.home-head__eyebrow { font-size: var(--fs-sm); color: var(--muted); }
.home-head__title { font-size: 26px; font-weight: 700; letter-spacing: 0.02em; }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
}
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat__label { font-size: var(--fs-xs); color: var(--muted); }
.stat__value {
  font-size: 24px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.stat__value small { font-size: var(--fs-sm); color: var(--muted); font-weight: 400; margin-left: 2px; }
.stats .bar { grid-column: 1 / -1; }

.resume {
  display: flex;
  flex-direction: column;
  gap: 12px;
  border-color: var(--accent-soft);
  background: var(--surface);
}
.resume__meta { font-size: var(--fs-xs); color: var(--muted); }
.resume__title { font-size: var(--fs-lg); font-weight: 700; }

/* ---------- List rows ---------- */
.rows {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.row {
  width: 100%;
  border: 0;
  background: none;
  text-align: left;
  padding: 14px 12px 14px 16px;
  min-height: 64px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}
.row + .row { border-top: 1px solid var(--line); }
.row:active:not(:disabled) { background: var(--accent-soft); }
.row:disabled { cursor: default; }
.row:disabled .row__title { color: var(--faint); }
.row__icon {
  flex: none;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  background: var(--accent-soft);
  color: var(--accent);
  display: grid;
  place-items: center;
}
.row:disabled .row__icon { background: var(--bg); color: var(--faint); }
.row__icon svg { width: 20px; height: 20px; }
.row__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.row__title { font-size: var(--fs-md); font-weight: 700; }
.row__sub { font-size: var(--fs-xs); color: var(--muted); }
.row__chev { flex: none; color: var(--faint); width: 20px; height: 20px; }
.row__aside { flex: none; display: flex; align-items: center; gap: 4px; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: var(--fs-xs);
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 999px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  background: var(--bg);
  color: var(--muted);
}
.chip--progress { background: var(--accent-soft); color: var(--accent); }
.chip--done { background: var(--ok-soft); color: var(--ok); }
.chip svg { width: 12px; height: 12px; }

/* ---------- Progress bar ---------- */
.bar {
  height: 6px;
  border-radius: 999px;
  background: var(--line);
  overflow: hidden;
}
.bar__fill {
  height: 100%;
  border-radius: inherit;
  background: var(--accent);
  transition: width 0.3s ease;
}
.bar--done .bar__fill { background: var(--ok); }
.row .bar { margin-top: 4px; height: 4px; }

/* ---------- Study ---------- */
.study-head {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.page-tag {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}
.page-tag__num {
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.page-tag__title { font-size: var(--fs-lg); font-weight: 700; }
.page-tag__lead { font-size: var(--fs-xs); color: var(--muted); width: 100%; }
.progress {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.progress__text {
  display: flex;
  justify-content: space-between;
  font-size: var(--fs-sm);
  color: var(--muted);
}
.progress__count { font-variant-numeric: tabular-nums; color: var(--ink); }
.progress__count b { font-size: var(--fs-lg); }

.term-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.term-grid > .term:last-child:nth-child(odd) { grid-column: 1 / -1; }

.term {
  position: relative;
  min-height: 86px;
  padding: 14px 14px 12px;
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
  text-align: left;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  transition: border-color 0.2s, background-color 0.2s, transform 0.1s;
}
.term:active { transform: scale(0.98); }
.term__name {
  font-size: var(--fs-term);
  font-weight: 700;
  line-height: 1.3;
  padding-right: 22px;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
.term__reading { font-size: 11px; color: var(--faint); line-height: 1.3; }
.term__check {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  display: grid;
  place-items: center;
  color: transparent;
}
.term__check svg { width: 14px; height: 14px; }
.term.is-checked {
  border-color: var(--ok-line);
  background: var(--ok-soft);
  box-shadow: none;
}
.term.is-checked .term__check {
  background: var(--ok);
  border-color: var(--ok);
  color: var(--ok-ink);
}
.term.is-checked .term__reading { color: var(--muted); }
.term.just-checked .term__check { animation: pop 0.35s ease-out; }
@keyframes pop {
  0% { transform: scale(0.5); }
  70% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

.hint {
  font-size: var(--fs-xs);
  color: var(--muted);
  display: flex;
  gap: 6px;
  align-items: flex-start;
}
.hint svg { flex: none; width: 14px; height: 14px; margin-top: 2px; color: var(--faint); }
.notice {
  font-size: var(--fs-xs);
  color: var(--muted);
  border-top: 1px solid var(--line);
  padding-top: 12px;
}

/* ---------- Bottom dock ---------- */
.dock {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.dock__inner {
  max-width: calc(var(--app-max) - 32px);
  margin: 0 auto;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.dock__status { font-size: var(--fs-sm); color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- Buttons ---------- */
.btn {
  min-height: 52px;
  width: 100%;
  border: 0;
  border-radius: var(--radius-sm);
  padding: 0 20px;
  font-size: var(--fs-md);
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
}
.btn svg { width: 20px; height: 20px; }
.btn--primary { background: var(--accent); color: var(--accent-ink); }
.btn--ok { background: var(--ok); color: var(--ok-ink); }
.btn--ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn--text {
  background: none;
  color: var(--muted);
  min-height: 44px;
  font-weight: 400;
  font-size: var(--fs-sm);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.btn:active { filter: brightness(0.94); }
.btn-stack { display: flex; flex-direction: column; gap: 10px; }
.dock .btn { animation: rise 0.25s ease-out; }
@keyframes rise {
  from { transform: translateY(8px); opacity: 0.4; }
  to { transform: none; opacity: 1; }
}

/* ---------- Detail sheet ---------- */
.sheet-scrim {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: var(--scrim);
  animation: fade 0.2s ease-out;
}
.sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 41;
  max-width: var(--app-max);
  margin: 0 auto;
  max-height: calc(100% - 48px - env(safe-area-inset-top, 0px));
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  box-shadow: var(--shadow-sheet);
  display: flex;
  flex-direction: column;
  animation: slide 0.26s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.sheet__grip {
  width: 40px;
  height: 4px;
  border-radius: 999px;
  background: var(--line);
  margin: 8px auto 0;
}
.sheet__head {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding-block: 12px 4px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.sheet__titles { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding-top: 6px; }
.sheet__meta { font-size: var(--fs-xs); color: var(--muted); }
.sheet__term { font-size: 24px; font-weight: 700; }
.sheet__reading { font-size: var(--fs-sm); color: var(--faint); }
.sheet__body {
  overflow-y: auto;
  padding-block: 12px 16px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.sheet__label {
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--accent);
  margin-bottom: 4px;
}
.sheet__def { font-size: 16px; line-height: 1.85; }
.sheet__example {
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: var(--fs-sm);
  line-height: 1.75;
}
.sheet__example .sheet__label { color: var(--muted); }
.sheet__foot {
  border-top: 1px solid var(--line);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.sheet__done {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: var(--ok);
  font-size: var(--fs-sm);
  font-weight: 700;
  padding-bottom: 6px;
}
.sheet__done svg { width: 16px; height: 16px; }
@keyframes fade { from { opacity: 0; } }
@keyframes slide { from { transform: translateY(100%); } }

/* ---------- Complete ---------- */
.done-hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 8px;
  padding-top: 16px;
}
.done-hero__mark {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: var(--ok-soft);
  color: var(--ok);
  display: grid;
  place-items: center;
  margin-bottom: 4px;
}
.done-hero__mark svg { width: 32px; height: 32px; }
.done-hero__title { font-size: var(--fs-xl); font-weight: 700; }
.done-hero__sub { font-size: var(--fs-sm); color: var(--muted); }
.review { display: flex; flex-direction: column; gap: 16px; }
.review__group { display: flex; flex-direction: column; gap: 8px; }
.review__title { font-size: var(--fs-xs); color: var(--muted); font-weight: 700; }
.review__terms { display: flex; flex-wrap: wrap; gap: 6px; }
.review__term {
  font-size: var(--fs-sm);
  padding: 5px 10px;
  border-radius: 8px;
  background: var(--ok-soft);
  color: var(--ink);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- 表示切り替え ---------- */
.seg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  padding: 4px;
  background: var(--line);
  border-radius: 12px;
}
.seg__btn {
  min-height: 40px;
  border: 0;
  border-radius: 9px;
  background: none;
  color: var(--muted);
  font-size: var(--fs-sm);
  font-weight: 700;
  cursor: pointer;
}
.seg__btn[aria-pressed="true"] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow);
}

/* ---------- 説明つきで読む ---------- */
.read-list {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.read-item {
  width: 100%;
  border: 0;
  background: none;
  text-align: left;
  padding: 14px 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  cursor: pointer;
}
.read-item + .read-item { border-top: 1px solid var(--line); }
.read-item:active { background: var(--accent-soft); }
.read-item__head { display: flex; align-items: flex-start; gap: 10px; }
.read-item__term { flex: 1; min-width: 0; font-size: var(--fs-lg); font-weight: 700; line-height: 1.4; }
.read-item .term__check { position: static; flex: none; margin-top: 2px; }
.read-item.is-checked .term__check { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
.read-item__reading { font-size: 11px; color: var(--faint); }
.read-item__def { font-size: var(--fs-md); line-height: 1.8; }
.read-item__point {
  margin-top: 4px;
  font-size: var(--fs-sm);
  line-height: 1.7;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 8px;
  padding: 8px 10px;
}

/* ---------- シートの追加要素 ---------- */
.sheet__person {
  display: flex;
  gap: 10px;
  align-items: baseline;
  font-size: var(--fs-sm);
  font-weight: 700;
}
.sheet__person span {
  flex: none;
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 1px 6px;
}
.sheet__point {
  background: var(--accent-soft);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: var(--fs-md);
  line-height: 1.75;
  font-weight: 700;
}
.done-hero__tip { font-size: var(--fs-xs); color: var(--muted); max-width: 28em; }
.home-head__lead { font-size: var(--fs-sm); color: var(--muted); }

/* ---------- コンパクト表示（1画面に8枚を収める） ---------- */
.content--with-dock { gap: 14px; padding-top: 14px; }
.study-head { gap: 8px; }
.term-grid { gap: 8px; }
.term { min-height: 68px; padding: 10px 12px 9px; gap: 2px; border-radius: 12px; }
.term__name { font-size: clamp(16px, 4.4vw, 18px); padding-right: 0; }
.term__reading { font-size: 10.5px; }
.term__check { top: 8px; right: 8px; width: 20px; height: 20px; }
.term__check svg { width: 12px; height: 12px; }
.seg__btn { min-height: 36px; }
.term__name { word-break: normal; line-break: strict; overflow-wrap: break-word; text-wrap: balance; line-height: 1.3; }
/* チェック欄の余白は1行目だけに取る（2行目以降はカード幅いっぱいに使う） */
.term__name::before { content: ""; float: right; width: 18px; height: 1em; }

/* ---------- 基礎問題 ---------- */
.stat__value { font-size: 22px; }
.q-label { font-size: var(--fs-sm); color: var(--muted); font-weight: 700; }
.q-prompt {
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px 16px;
}
.q-prompt--term { font-size: 24px; font-weight: 700; line-height: 1.35; display: flex; flex-direction: column; gap: 4px; }
.q-prompt__reading { font-size: var(--fs-xs); color: var(--faint); font-weight: 400; }
.q-prompt--def { font-size: var(--fs-md); line-height: 1.85; }
.q-opts { display: flex; flex-direction: column; gap: 8px; }
.q-opt {
  width: 100%;
  min-height: 52px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  text-align: left;
  padding: 12px 12px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  cursor: pointer;
  font-size: var(--fs-lg);
  font-weight: 700;
  line-height: 1.45;
}
.q-opt--def { font-size: var(--fs-sm); font-weight: 400; line-height: 1.7; }
.q-opt:active:not(:disabled) { background: var(--accent-soft); }
.q-opt:disabled { cursor: default; }
.q-opt__num {
  flex: none;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--bg);
  color: var(--muted);
  font-size: var(--fs-xs);
  font-weight: 700;
  display: grid;
  place-items: center;
  margin-top: 1px;
  font-variant-numeric: tabular-nums;
}
.q-opt__text { flex: 1; min-width: 0; }
.q-opt__mark { flex: none; width: 22px; height: 22px; }
.q-opt__mark svg { width: 22px; height: 22px; }
.q-opt.is-correct { border-color: var(--ok); background: var(--ok-soft); }
.q-opt.is-correct .q-opt__num { background: var(--ok); color: var(--ok-ink); }
.q-opt.is-correct .q-opt__mark { color: var(--ok); }
.q-opt.is-wrong { border-color: var(--ng); background: var(--ng-soft); }
.q-opt.is-wrong .q-opt__num { background: var(--ng); color: var(--surface); }
.q-opt.is-wrong .q-opt__mark { color: var(--ng); }
.q-opt.is-dim { opacity: 0.55; }
.q-feedback {
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  border: 1px solid var(--ok-line);
  background: var(--ok-soft);
}
.q-feedback.is-wrong { border-color: var(--ng-line); background: var(--ng-soft); }
.q-feedback__verdict { font-size: var(--fs-sm); font-weight: 700; color: var(--ok); }
.q-feedback.is-wrong .q-feedback__verdict { color: var(--ng); }
.q-feedback__term { font-size: var(--fs-lg); font-weight: 700; }
.q-feedback__def { font-size: var(--fs-sm); line-height: 1.75; }
.q-feedback__point { font-size: var(--fs-sm); line-height: 1.7; color: var(--accent); font-weight: 700; }
.score { display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
.score b { font-size: 48px; line-height: 1; }
.score span { font-size: var(--fs-lg); color: var(--muted); }
.done-hero .bar { width: 100%; max-width: 280px; margin-top: 6px; }
.read-item--static { cursor: default; }
.read-item--static:active { background: none; }

/* ---------- 過去に間違えた問題・苦手傾向分析 ---------- */
.chip--ng { background: var(--ng-soft); color: var(--ng); }
.bar--ng .bar__fill { background: var(--ng); }
.section__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.link-btn {
  border: 0;
  background: none;
  color: var(--accent);
  font-size: var(--fs-sm);
  font-weight: 700;
  padding: 8px 0;
  min-height: 40px;
  cursor: pointer;
}
.review-sum { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.review-sum .btn { width: auto; }
.empty { display: flex; flex-direction: column; gap: 12px; }
.empty__title { font-size: var(--fs-lg); font-weight: 700; }
.empty__text { font-size: var(--fs-sm); color: var(--muted); line-height: 1.75; }
.advice {
  margin: 0;
  padding: 14px 16px 14px 32px;
  background: var(--accent-soft);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: var(--fs-sm);
  line-height: 1.75;
}
.focus {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.focus__head { display: flex; align-items: flex-start; gap: 10px; }
.focus__rank {
  flex: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: var(--fs-sm);
  font-weight: 700;
  display: grid;
  place-items: center;
}
.focus__titles { flex: 1; min-width: 0; }
.focus__meta { font-size: var(--fs-xs); color: var(--muted); }
.focus__title { font-size: var(--fs-lg); font-weight: 700; line-height: 1.4; }
.focus__terms { font-size: var(--fs-sm); font-weight: 700; line-height: 1.7; }
.focus__terms span {
  display: block;
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--ng);
}
.focus__why { font-size: var(--fs-sm); color: var(--muted); line-height: 1.7; }
.focus__actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn--sm { min-height: 44px; font-size: var(--fs-sm); padding: 0 10px; gap: 6px; }
.btn--sm svg { width: 16px; height: 16px; }
.meters { display: flex; flex-direction: column; gap: 14px; }
.meter { display: flex; flex-direction: column; gap: 6px; }
.meter__head { display: flex; justify-content: space-between; gap: 12px; font-size: var(--fs-sm); }
.meter__label { font-weight: 700; min-width: 0; }
.meter__value { font-weight: 700; font-variant-numeric: tabular-nums; }
.meter__sub { font-size: var(--fs-xs); color: var(--muted); }


/* ==========================================================================
   白と青のデザイン ・ コンパクト表示（スクロールを減らすための最終調整）
   ========================================================================== */
body { line-height: 1.55; }
body::before { background: var(--brand); }

/* 上部バー：青地に白文字 */
.topbar {
  background: var(--brand);
  color: var(--brand-ink);
  border-bottom: 0;
  padding-block: 4px 6px;
  min-height: 52px;
}
.topbar__eyebrow { color: var(--brand-muted); font-size: var(--fs-xs); }
.topbar__title { font-size: var(--fs-lg); line-height: 1.3; }
.topbar .icon-btn { color: var(--brand-ink); }
.topbar .icon-btn:active { background: rgba(255, 255, 255, 0.16); }
.icon-btn svg { width: 22px; height: 22px; }

.content { padding-block: 12px 20px; gap: 14px; }
.content--with-dock { padding-top: 10px; gap: 10px; padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
.section { gap: 6px; }
.section__label { color: var(--accent); letter-spacing: 0.06em; }

.panel { padding: 12px 14px; border-color: var(--line); }
.stats { gap: 8px; }
.stat__value { font-size: 20px; line-height: 1.3; }
.resume { gap: 8px; background: var(--tint); border-color: var(--line); }
.resume__title { font-size: var(--fs-md); }

.rows { border-color: var(--line); }
.row { min-height: 50px; padding: 9px 10px 9px 14px; gap: 10px; }
.row__icon { width: 30px; height: 30px; border-radius: 8px; }
.row__icon svg { width: 17px; height: 17px; }
.row__body { gap: 2px; }
.row__title { font-size: var(--fs-md); line-height: 1.4; }
.row__sub { line-height: 1.5; }
.row__chev { width: 18px; height: 18px; }
.row:disabled .row__icon { background: var(--tint); }
.row .bar { margin-top: 3px; height: 3px; }
.chip { padding: 2px 7px; background: var(--tint); }

.bar { height: 5px; background: var(--accent-soft); }

.btn { min-height: 46px; font-size: var(--fs-md); border-radius: var(--radius-sm); gap: 6px; }
.btn svg { width: 18px; height: 18px; }
.btn--ghost { background: var(--surface); border-color: var(--line); color: var(--accent); }
.btn--text { min-height: 36px; }
.btn-stack { gap: 8px; }
.btn--sm { min-height: 38px; }

.hint { font-size: var(--fs-xs); }
.notice { font-size: var(--fs-xs); padding-top: 8px; }

/* 基礎学習 */
.study-head { gap: 6px; }
.page-tag { gap: 6px; row-gap: 0; }
.page-tag__title { font-size: var(--fs-md); }
.progress { gap: 4px; }
.progress__text { font-size: var(--fs-xs); align-items: baseline; }
.progress__count b { font-size: var(--fs-md); }
.seg { padding: 3px; gap: 3px; background: var(--tint); border: 1px solid var(--line); border-radius: 10px; }
.seg__btn { min-height: 32px; font-size: var(--fs-sm); border-radius: 7px; }
.seg__btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.term-grid { gap: 7px; }
.term { min-height: 60px; padding: 8px 10px 7px; border-width: 1.5px; border-color: var(--line); border-radius: 10px; }
.term:not(.is-checked):active { border-color: var(--accent); background: var(--accent-soft); }
.term__check { top: 7px; right: 7px; width: 18px; height: 18px; }
.term__name::before { width: 16px; }
.term__reading { font-size: 10px; }
.dock { padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px)); border-top-color: var(--line); }
.dock__inner { min-height: 46px; }
.dock__status { font-size: var(--fs-xs); }

.read-item { padding: 10px 14px 12px; gap: 3px; }
.read-item__term { font-size: var(--fs-md); }
.read-item__def { font-size: var(--fs-sm); line-height: 1.7; }
.read-item__point { font-size: var(--fs-xs); padding: 6px 9px; margin-top: 2px; }

/* 説明シート */
.sheet__head { padding-block: 8px 0; }
.sheet__term { font-size: 20px; }
.sheet__body { padding-block: 8px 12px; gap: 12px; }
.sheet__def { font-size: var(--fs-md); line-height: 1.8; }
.sheet__point { padding: 10px 12px; font-size: var(--fs-sm); }
.sheet__example { padding: 10px 12px; }
.sheet__foot { padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px)); }

/* 完了・結果 */
.done-hero { padding-top: 4px; gap: 4px; }
.done-hero__mark { width: 44px; height: 44px; margin-bottom: 0; }
.done-hero__mark svg { width: 24px; height: 24px; }
.done-hero__title { font-size: var(--fs-xl); }
.score b { font-size: 40px; }
.review { gap: 10px; }
.review__term { font-size: var(--fs-xs); padding: 4px 8px; background: var(--tint); }

/* 基礎問題 */
.q-label { font-size: var(--fs-xs); }
.q-prompt { padding: 12px 14px; border-color: var(--line); }
.q-prompt--term { font-size: 20px; }
.q-prompt--def { font-size: var(--fs-md); line-height: 1.75; }
.q-opts { gap: 6px; }
.q-opt { min-height: 44px; padding: 8px 10px; gap: 8px; font-size: var(--fs-md); border-color: var(--line); border-radius: 10px; }
.q-opt--def { font-size: var(--fs-sm); line-height: 1.6; }
.q-opt__num { width: 22px; height: 22px; background: var(--tint); color: var(--accent); }
.q-opt__mark, .q-opt__mark svg { width: 20px; height: 20px; }
.q-feedback { padding: 10px 12px; gap: 4px; }
.q-feedback__term { font-size: var(--fs-md); }

/* 分析・復習 */
.advice { padding: 10px 12px 10px 28px; gap: 6px; font-size: var(--fs-sm); line-height: 1.65; background: var(--tint); border: 1px solid var(--line); }
.focus { padding: 12px 14px; gap: 8px; }
.focus__title { font-size: var(--fs-md); }
.focus__rank { width: 22px; height: 22px; font-size: var(--fs-xs); }
.meters { gap: 10px; }
.empty { gap: 10px; }
.empty__title { font-size: var(--fs-md); }
.link-btn { min-height: 32px; padding: 4px 0; }

/* ---------- 学習画面の見出し（1行にまとめる） ---------- */
.study-head { gap: 5px; }
.study-head__row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.study-head__row .page-tag__title { min-width: 0; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.study-head__row .progress__count { flex: none; font-size: var(--fs-xs); color: var(--muted); }
.study-head__row .progress__count b { color: var(--ink); font-size: var(--fs-md); }
.page-tag__lead { width: auto; }

/* ---------- 説明つきで読む：1画面のまとめシート ---------- */
.read-sheet {
  font-size: 14px; /* JS が画面に収まるサイズに調整する */
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  overflow: hidden;
}
.rs-item {
  position: relative;
  width: 100%;
  border: 0;
  background: none;
  text-align: left;
  font-size: inherit;
  padding: 0.5em 0.75em 0.55em;
  display: flex;
  flex-direction: column;
  gap: 0.15em;
  cursor: pointer;
}
.rs-item + .rs-item { border-top: 1px solid var(--line); }
.rs-item:active { background: var(--accent-soft); }
.rs-item.is-checked { background: var(--ok-soft); }
.rs-item__text { line-height: 1.5; padding-right: 1.4em; }
.rs-item__term {
  font-weight: 700;
  color: var(--accent);
  margin-right: 0.5em;
}
.rs-item.is-checked .rs-item__term { color: var(--ok); }
.rs-item__point {
  font-size: 0.9em;
  line-height: 1.45;
  color: var(--muted);
  padding-left: 0.6em;
  border-left: 2px solid var(--accent);
}
.rs-item__check {
  position: absolute;
  top: 0.55em;
  right: 0.6em;
  width: 1.15em;
  height: 1.15em;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  display: grid;
  place-items: center;
  color: transparent;
}
.rs-item__check svg { width: 0.75em; height: 0.75em; }
.rs-item.is-checked .rs-item__check { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
/* まとめシートの余白をさらに詰める（小さい画面でも1画面に収める） */
.rs-item { padding: 0.4em 0.65em 0.45em; gap: 0.1em; }
.rs-item__text { line-height: 1.45; }
.rs-item__point { line-height: 1.4; }
.content--with-dock .seg__btn { min-height: 30px; }
.content--read { gap: 7px; padding-top: 8px; }

/* ---------- ページの切り替え ---------- */
.page-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-top: 2px; }
.page-tabs::-webkit-scrollbar { display: none; }
.page-tab {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 30px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--muted);
  font-size: var(--fs-xs);
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}
.page-tab svg { width: 12px; height: 12px; color: var(--ok); }
.page-tab.is-current { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.page-tab.is-current svg { color: var(--accent-ink); }

/* ---------- まとめシート：右の丸でチェック ---------- */
.rs-item { flex-direction: row; align-items: stretch; gap: 0; padding: 0; cursor: default; }
.rs-item:active { background: none; }
.rs-item__body {
  flex: 1;
  min-width: 0;
  border: 0;
  background: none;
  text-align: left;
  font-size: inherit;
  color: inherit;
  padding: 0.4em 0.2em 0.45em 0.65em;
  display: flex;
  flex-direction: column;
  gap: 0.1em;
  cursor: pointer;
}
.rs-item__body:active { background: var(--accent-soft); }
.rs-item__text { padding-right: 0; }
.rs-item__check {
  position: static;
  flex: none;
  align-self: stretch;
  width: 2.6em;
  min-width: 36px;
  border: 0;
  border-radius: 0;
  background: none;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 0.45em;
  cursor: pointer;
  color: transparent;
}
.rs-item__check svg {
  width: 1.25em;
  height: 1.25em;
  padding: 0.18em;
  border-radius: 50%;
  border: 1.5px solid var(--faint);
  box-sizing: border-box;
}
.rs-item__check:active svg { border-color: var(--ok); }
.rs-item.is-checked .rs-item__check { background: none; }
.rs-item.is-checked .rs-item__check svg { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }

/* ---------- 5択 ---------- */
.q-feedback__trap { font-size: var(--fs-sm); font-weight: 700; color: var(--ng); }
.rs-item__check { width: 2.1em; min-width: 30px; }
.rs-item__body { padding-right: 0; }
.study-head__row { align-items: center; }
.study-head__row .page-tabs { flex: 1; min-width: 0; margin-top: 0; }
.page-tab { min-height: 28px; padding: 0 9px; }

/* ---------- 年度別の本試験：マークシート ---------- */
a.btn { text-decoration: none; }
.verdict { font-size: var(--fs-sm); font-weight: 700; color: var(--muted); text-align: center; }
.verdict--ok { color: var(--ok); }
.verdict--ng { color: var(--ng); }
.ms-score { display: flex; align-items: baseline; justify-content: center; gap: 8px; font-size: var(--fs-md); }
.ms-score b { font-size: 28px; font-variant-numeric: tabular-nums; }
.ms-sheet { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.ms-row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
.ms-row + .ms-row { border-top: 1px solid var(--line); }
.ms-row.is-ng { background: var(--ng-soft); }
.ms-q { flex: none; width: 3.6em; font-size: var(--fs-sm); font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.ms-btns { flex: 1; display: flex; justify-content: space-between; gap: 6px; max-width: 260px; }
.ms-btn {
  width: 38px; height: 38px; border-radius: 50%;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  font-size: var(--fs-md); font-weight: 700; cursor: pointer; font-variant-numeric: tabular-nums;
}
.ms-btn.is-chosen { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ms-btn:disabled { cursor: default; }
.ms-btn.is-answer { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.ms-btn.is-chosen.is-answer { background: var(--ok); color: var(--ok-ink); }
.ms-btn.is-wrong { background: var(--ng); border-color: var(--ng); color: var(--surface); }
.ms-mark { flex: none; width: 1.2em; text-align: center; font-weight: 700; }
.ms-row.is-ok .ms-mark { color: var(--ok); }
.ms-row.is-ng .ms-mark { color: var(--ng); }
.btn:disabled { opacity: 0.5; cursor: default; }
.rs-item__body { padding-top: 0.38em; padding-bottom: 0.42em; }

</style>
</head>
<body>
<div id="app" class="app" lang="ja"></div>
<div id="sheet-root" lang="ja"></div>
<script>
/**
 * 教材データの土台（画面のコードとは独立）
 *
 * 分野ごとの教材は src/data/fields/ に1ファイルずつ置き、defineField() で登録する。
 * 構造: field → themes[] → pages[] → terms[]
 *   - 1ページ = 基礎学習画面の1画面。スマホ1画面に収まる8語まで
 *   - term.id は進捗・正答率の記録キー。省略すると「テーマID.用語」で自動生成される
 *     （公開後に用語名を変えると記録が引き継がれない点に注意）
 *   - pages が空のテーマは「準備中」として表示される
 *
 * 収録方針: 介護福祉士国家試験に出る・出やすい内容だけを入れる。
 *   出ない／ほぼ出ない内容は、教科書に載っていても入れない。
 *   人物は出題が多い人に絞り、その他の人名は手法の「提唱者（person）」欄で扱う。
 *
 * term は次のどちらの書き方でもよい
 *   オブジェクト: { term, reading, definition, point, person, profile, example, id }
 *   配列（短縮形）: ["用語", "よみ", "説明", "覚えるポイント", { person: "提唱者" など任意 }]
 */
window.KAIGO_DATA = {
  version: 3,
  updated: "2026-11",
  disclaimer: "掲載内容は受験用テキスト・厚生労働省の資料・最新の法令と照合してご利用ください。",

  /** 試験科目の順（領域ごと） */
  areas: [
    { name: "人間と社会", fields: ["dignity", "relations", "society"] },
    { name: "介護", fields: ["care-basics", "comm-skills", "life-support", "care-process"] },
    { name: "こころとからだのしくみ", fields: ["development", "dementia", "disability", "body"] },
    { name: "医療的ケア", fields: ["medical"] },
  ],

  fields: [],
};

window.defineField = function (spec) {
  var area = window.KAIGO_DATA.areas.filter(function (a) {
    return a.fields.indexOf(spec.id) !== -1;
  })[0];
  spec.area = area ? area.name : "";

  spec.themes.forEach(function (theme) {
    theme.summary = theme.summary || "";
    theme.pages = (theme.pages || []).map(function (page, pi) {
      page.id = page.id || "p" + (pi + 1);
      page.terms = page.terms.map(function (t) {
        if (Array.isArray(t)) {
          var extra = t[4] || {};
          t = {
            term: t[0],
            reading: t[1] || "",
            definition: t[2],
            point: t[3] || "",
            person: extra.person,
            profile: extra.profile,
            example: extra.example,
          };
        }
        t.id = t.id || theme.id + "." + t.term;
        return t;
      });
      return page;
    });
  });

  window.KAIGO_DATA.fields.push(spec);
};

/** 全ファイル読み込み後に呼び、試験科目の順に並べる */
window.finalizeData = function () {
  var order = [];
  window.KAIGO_DATA.areas.forEach(function (a) { order = order.concat(a.fields); });
  window.KAIGO_DATA.fields.sort(function (a, b) {
    return order.indexOf(a.id) - order.indexOf(b.id);
  });
};

<script>
/**
 * 学習進捗ストア（端末内の localStorage に保存）
 *
 * 将来のバックエンド移行・機能追加を想定し、画面からはこの API だけを使う。
 *   - checked:   用語ごとの「確認した」日時
 *   - themes:    テーマごとの完了日時・完了回数
 *   - last:      続きから学習するための位置
 *   - history:   学習イベントの記録（学習履歴・苦手分析の元データ）
 */
window.KaigoStore = (function () {
  var KEY = "kaigo-study.progress.v1";
  var HISTORY_LIMIT = 500;

  function empty() {
    return { version: 1, checked: {}, themes: {}, last: null, history: [] };
  }

  function read() {
    try {
      var raw = window.localStorage.getItem(KEY);
      if (!raw) return empty();
      var parsed = JSON.parse(raw);
      return Object.assign(empty(), parsed);
    } catch (e) {
      return empty();
    }
  }

  var state = read();

  function save() {
    try {
      window.localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      /* 保存できない環境でもメモリ上で動作を続ける */
    }
  }

  function log(type, payload) {
    state.history.push(Object.assign({ type: type, at: Date.now() }, payload));
    if (state.history.length > HISTORY_LIMIT) {
      state.history.splice(0, state.history.length - HISTORY_LIMIT);
    }
  }

  return {
    isChecked: function (termId) {
      return Boolean(state.checked[termId]);
    },

    setChecked: function (termId, value) {
      if (value) state.checked[termId] = Date.now();
      else delete state.checked[termId];
      log(value ? "term_checked" : "term_unchecked", { termId: termId });
      save();
    },

    countChecked: function (termIds) {
      var n = 0;
      for (var i = 0; i < termIds.length; i++) if (state.checked[termIds[i]]) n++;
      return n;
    },

    completeTheme: function (themeId) {
      var t = state.themes[themeId] || { completedCount: 0 };
      t.completedAt = Date.now();
      t.completedCount = (t.completedCount || 0) + 1;
      state.themes[themeId] = t;
      log("theme_completed", { themeId: themeId });
      save();
    },

    isThemeCompleted: function (themeId) {
      return Boolean(state.themes[themeId] && state.themes[themeId].completedAt);
    },

    /** テーマの確認状態を消して最初から学習し直す（完了履歴は残す） */
    resetTheme: function (themeId, termIds) {
      termIds.forEach(function (id) {
        delete state.checked[id];
      });
      log("theme_reset", { themeId: themeId });
      save();
    },

    setLast: function (themeId, pageIndex) {
      state.last = { themeId: themeId, pageIndex: pageIndex, at: Date.now() };
      save();
    },

    getLast: function () {
      return state.last;
    },

    getCompletedCount: function (themeId) {
      return (state.themes[themeId] && state.themes[themeId].completedCount) || 0;
    },

    /* ---------- 基礎問題 ---------- */

    /** 1問ごとの解答を記録（苦手問題・正答率の元データ） */
    recordAnswer: function (termId, correct, dir) {
      state.answers = state.answers || {};
      var a = state.answers[termId] || { correct: 0, wrong: 0 };
      if (correct) a.correct++;
      else a.wrong++;
      a.last = correct;
      a.at = Date.now();
      if (dir) {
        a.dirs = a.dirs || {};
        var d = a.dirs[dir] || { c: 0, w: 0 };
        if (correct) d.c++;
        else d.w++;
        a.dirs[dir] = d;
      }
      state.answers[termId] = a;
      log("answer", { termId: termId, correct: correct, dir: dir });
      save();
    },

    /** 用語の集合について、解答済みの数と最後の解答が正解だった数 */
    answerStats: function (termIds) {
      var answers = state.answers || {};
      var answered = 0, correct = 0;
      termIds.forEach(function (id) {
        var a = answers[id];
        if (!a) return;
        answered++;
        if (a.last) correct++;
      });
      return { answered: answered, correct: correct };
    },

    /** 用語ID → { correct, wrong, last, at, dirs } */
    getAnswers: function () {
      return state.answers || {};
    },

    /* ---------- 年度別の本試験（マークシート） ---------- */
    getPast: function (yearId) {
      state.past = state.past || {};
      return state.past[yearId] || { answers: {}, graded: {} };
    },
    setPastAnswer: function (yearId, q, choice) {
      state.past = state.past || {};
      var p = state.past[yearId] || { answers: {}, graded: {} };
      p.answers[q] = choice;
      state.past[yearId] = p;
      save();
    },
    gradePast: function (yearId, subjectIndex) {
      state.past = state.past || {};
      var p = state.past[yearId] || { answers: {}, graded: {} };
      p.graded[subjectIndex] = Date.now();
      state.past[yearId] = p;
      log("past_graded", { year: yearId, subject: subjectIndex });
      save();
    },
    resetPast: function (yearId, subjectIndex, from, to) {
      state.past = state.past || {};
      var p = state.past[yearId];
      if (!p) return;
      for (var q = from; q <= to; q++) delete p.answers[q];
      delete p.graded[subjectIndex];
      save();
    },

    /* ---------- 過去問題 ---------- */
    recordExam: function (qid, correct) {
      state.exams = state.exams || {};
      var a = state.exams[qid] || { correct: 0, wrong: 0 };
      if (correct) a.correct++;
      else a.wrong++;
      a.last = correct;
      a.at = Date.now();
      state.exams[qid] = a;
      log("exam_answer", { qid: qid, correct: correct });
      save();
    },

    getExamAnswers: function () {
      return state.exams || {};
    },

    /** 問題の集合について、解いた数・最後の解答が正解だった数・延べの正誤 */
    examStats: function (qids) {
      var ex = state.exams || {};
      var answered = 0, correct = 0, c = 0, w = 0;
      qids.forEach(function (id) {
        var a = ex[id];
        if (!a) return;
        answered++;
        if (a.last) correct++;
        c += a.correct; w += a.wrong;
      });
      return { answered: answered, correct: correct, attempts: c + w, rate: c + w ? Math.round((c / (c + w)) * 100) : null };
    },

    saveQuizResult: function (themeId, score, total) {
      state.quiz = state.quiz || {};
      var q = state.quiz[themeId] || { count: 0, best: 0 };
      q.count++;
      q.last = score;
      q.total = total;
      q.best = Math.max(q.best || 0, Math.round((score / total) * 100));
      q.at = Date.now();
      state.quiz[themeId] = q;
      log("quiz_finished", { themeId: themeId, score: score, total: total });
      save();
    },

    getQuizResult: function (themeId) {
      return (state.quiz && state.quiz[themeId]) || null;
    },

    /** 表示モードなど、利用者ごとの設定 */
    getPref: function (key, fallback) {
      var prefs = state.prefs || {};
      return key in prefs ? prefs[key] : fallback;
    },

    setPref: function (key, value) {
      state.prefs = state.prefs || {};
      state.prefs[key] = value;
      save();
    },

    getHistory: function () {
      return state.history.slice();
    },
  };
})();

</script>

    layers: '<path d="M12 4l8 4-8 4-8-4 8-4z"/><path d="M4 12l8 4 8-4M4 16l8 4 8-4"/>',
    doc: '<path d="M7 3.5h7l4 4V20a.5.5 0 01-.5.5h-10A.5.5 0 017 20V3.5z"/><path d="M14 3.5V8h4M9.5 12.5h5M9.5 16h5"/>',
    flag: '<path d="M6 21V4M6 4h11l-2 4 2 4H6"/>',
    book: '<path d="M4 5.5A1.5 1.5 0 015.5 4H11v16H5.5A1.5 1.5 0 014 18.5v-13zM20 5.5A1.5 1.5 0 0018.5 4H13v16h5.5a1.5 1.5 0 001.5-1.5v-13z"/>',

    chart: '<path d="M4 20h16M7 16v-5M12 16V7M17 16v-8"/>',
  };
  function icon(name, cls) {
    return (
      '<svg class="' + (cls || "") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + "</svg>"
    );
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ---------------- 教材インデックス ---------------- */
  var fieldById = {};
  var themeById = {};
  var fieldOfTheme = {};
  var termById = {};

  DATA.fields.forEach(function (f) {
    fieldById[f.id] = f;
    f.themes.forEach(function (t) {
      themeById[t.id] = t;
      fieldOfTheme[t.id] = f;
      t.pages.forEach(function (p, pi) {
        p.terms.forEach(function (term) {
          termById[term.id] = { term: term, theme: t, page: p, pageIndex: pi };
        });
      });
    });
  });

  /* 過去問題の索引（関連用語は同じ科目のカードから名前で探す） */
  var examById = {};
  var examsByField = {};
  var EXAMS = window.KAIGO_EXAMS || {};
  Object.keys(EXAMS).forEach(function (fid) {
    var field = fieldById[fid];
    if (!field) return;
    examsByField[fid] = EXAMS[fid].map(function (q, i) {
      var id = "exam." + fid + "." + (i + 1);
      q.id = id;
      q.field = fid;
      q.termIds = (q.terms || []).map(function (name) {
        var hit = null;
        field.themes.forEach(function (t) {
          t.pages.forEach(function (p) { p.terms.forEach(function (x) { if (!hit && x.term === name) hit = x.id; }); });
        });
        return hit;
      }).filter(Boolean);
      examById[id] = q;
      return id;
    });
  });

  function isReady(theme) { return theme.pages.length > 0; }
  function pageTermIds(page) { return page.terms.map(function (t) { return t.id; }); }
  function themeTermIds(theme) {
    return theme.pages.reduce(function (acc, p) { return acc.concat(pageTermIds(p)); }, []);
  }
  function fieldTermIds(field) {
    return field.themes.reduce(function (acc, t) { return acc.concat(themeTermIds(t)); }, []);
  }
  function allTermIds() {
    return DATA.fields.reduce(function (acc, f) { return acc.concat(fieldTermIds(f)); }, []);
  }
  function readyThemes() {
    var list = [];
    DATA.fields.forEach(function (f) { f.themes.forEach(function (t) { if (isReady(t)) list.push(t); }); });
    return list;
  }
  /** 未確認の用語が残っている最初のページ（全て確認済みなら 0） */
  function firstOpenPage(theme) {
    for (var i = 0; i < theme.pages.length; i++) {
      var ids = pageTermIds(theme.pages[i]);
      if (Store.countChecked(ids) < ids.length) return i;

    return 0;

  var openTermId = null;
  var lastTrigger = null;
  var justChecked = null;

  function go(next) {

    closeSheet(true);
    render();
    window.scrollTo(0, 0);
  }

  function startTheme(themeId, pageIndex) {
    var theme = themeById[themeId];
    var pi = typeof pageIndex === "number" ? pageIndex : firstOpenPage(theme);

    go({ name: "study", themeId: themeId, pageIndex: pi });

        : '<span style="width:8px"></span>') +
      '<div class="topbar__titles">' +
      (eyebrow ? '<p class="topbar__eyebrow">' + esc(eyebrow) + "</p>" : "") +
      '<h1 class="topbar__title">' + esc(title) + "</h1>" +
      "</div></header>"
    );
  }

  function bar(done, total) {
    var pct = total ? Math.round((done / total) * 100) : 0;
    return (
      '<div class="bar' + (total && done === total ? " bar--done" : "") + '" role="progressbar" aria-valuemin="0" aria-valuemax="' +
      total + '" aria-valuenow="' + done + '"><div class="bar__fill" style="width:' + pct + '%"></div></div>'
    );
  }

  function themeStatusChip(theme) {
    if (!isReady(theme)) return '<span class="chip">準備中</span>';
    var ids = themeTermIds(theme);
    var n = Store.countChecked(ids);
    if (n === ids.length) return '<span class="chip chip--done">' + icon("check") + "完了</span>";
    if (n > 0) return '<span class="chip chip--progress">' + n + " / " + ids.length + "</span>";
    if (Store.isThemeCompleted(theme.id)) return '<span class="chip chip--done">' + icon("check") + "完了済み</span>";
    return '<span class="chip">未学習</span>';
  }

  /* ---------------- 1. ホーム ---------------- */
  function renderHome() {
    var ids = allTermIds();
    var checked = Store.countChecked(ids);
    var themes = readyThemes();
    var doneThemes = themes.filter(function (t) { return Store.isThemeCompleted(t.id); }).length;
    var last = Store.getLast();
    var lastTheme = last && themeById[last.themeId];

    var resume = "";
    if (lastTheme && isReady(lastTheme)) {
      var lIds = themeTermIds(lastTheme);
      var lDone = Store.countChecked(lIds);
      var finished = lDone === lIds.length;
      resume =
        '<section class="section"><h2 class="section__label">' + (finished ? "前回の学習" : "続きから") + "</h2>" +
        '<div class="panel resume">' +
        '<div><p class="resume__meta">' + esc(fieldOfTheme[lastTheme.id].name) + "</p>" +
        '<p class="resume__title">' + esc(lastTheme.name) + "</p></div>" +
        '<div class="progress"><div class="progress__text"><span>確認済み</span><span class="progress__count">' +
        lDone + " / " + lIds.length + "</span></div>" + bar(lDone, lIds.length) + "</div>" +
        '<button class="btn btn--primary" data-action="resume">' +
        (finished ? "もう一度見る" : "続きから学習する") + icon("arrow") + "</button>" +
        "</div></section>";
    }

    var quizStats = Store.answerStats(ids);
    var menu = MENU.map(function (m) {

  /* ---------------- 6. 基礎問題・過去問題（5択） ---------------- */
  var quiz = null;
  var CHOICES = 5;

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  /* ----- 紛らわしい選択肢づくり ----- */

  /** 2文字ずつの重なりで、用語名がどれくらい似ているか（0〜1） */
  function bigrams(s) {
    var set = {};
    for (var i = 0; i < s.length - 1; i++) set[s.substr(i, 2)] = true;
    return set;
  }
  function similarity(a, b) {
    var A = bigrams(a), B = bigrams(b), inter = 0, union = 0, k;
    for (k in A) { union++; if (B[k]) inter++; }
    for (k in B) if (!A[k]) union++;
    return union ? inter / union : 0;
  }

  /**
   * 正解に近い順に誤答の用語を選ぶ。
   * 用語名が似ているもの（例：腹圧性尿失禁と切迫性尿失禁）、同じページ・同じテーマのものを優先する。
   */
  function pickDistractors(termId, dir, count) {
    var entry = termById[termId];
    var field = fieldOfTheme[entry.theme.id];
    var key = dir === "t2d" ? "definition" : "term";
    var seen = {};
    seen[entry.term[key]] = true;
    var scored = fieldTermIds(field).filter(function (id) { return id !== termId; }).map(function (id) {
      var e = termById[id];
      var s = similarity(entry.term.term, e.term.term) * 2;
      if (e.page === entry.page) s += 0.6;
      else if (e.theme === entry.theme) s += 0.35;
      return { id: id, s: s + Math.random() * 0.25 };
    }).sort(function (a, b) { return b.s - a.s; });
    var picked = [];
    scored.forEach(function (x) {
      if (picked.length >= count) return;
      var v = termById[x.id].term[key];
      if (seen[v]) return;
      seen[v] = true;
      picked.push(x.id);
    });
    return picked;
  }

  /**
   * 正しい説明の一部だけを入れ替えた「ひっかけ」の説明をつくる（2択で迷わせる選択肢）。
   * 入れ替えられる語がなければ null。
   */
  var SWAP_PAIRS = [
    ["健側", "患側"], ["上顎", "下顎", /顎呼吸/], ["末梢", "中枢"], ["目頭", "目尻"], ["時計回り", "反時計回り"],
    ["副交感神経", "交感神経"], ["小腸", "大腸"], ["左側臥位", "右側臥位"], ["仰臥位", "側臥位"],
    ["増加", "減少"], ["高い", "低い"], ["浅い", "深い"], ["多い", "少ない"],
    ["以上", "以下"], ["早朝", "夕方"], ["前傾", "後傾"], ["内側", "外側"], ["下から", "上から"],
    ["急に", "徐々に"], ["市町村", "都道府県"], ["貸与", "購入"], ["名称独占", "業務独占"],
    ["共助", "公助"], ["陽性症状", "陰性症状"], ["流動性知能", "結晶性知能"], ["引き戸", "開き戸"],
    ["前から後ろ", "後ろから前"], ["近時記憶", "遠隔記憶"], ["保たれる", "失われる"],
  ];
  var NUM_UNITS = "歳|℃|万円|日間|日|回|時間|割|年|分|秒|%|％|cm|ml|か月|段階|項目|点|人";
  function makeFake(text) {
    var pairs = shuffle(SWAP_PAIRS);
    for (var i = 0; i < pairs.length; i++) {
      var a = pairs[i][0], b = pairs[i][1], skip = pairs[i][2];
      if (skip && skip.test(text)) continue;
      var alt = a.length >= b.length ? a + "|" + b : b + "|" + a;
      var first = text.match(new RegExp(alt));
      if (!first) continue;
      // 「市町村や都道府県」のように並べて書かれている場合は、入れ替えても意味が同じになるので使わない
      if (new RegExp("(" + alt + ")[や・、と]|及び|および").test(text) &&
          text.indexOf(a) !== -1 && text.indexOf(b) !== -1 &&
          new RegExp("(" + a + "[や・、と]" + b + ")|(" + b + "[や・、と]" + a + ")").test(text)) continue;
      // 両方の語をまとめて入れ替える（例：外すときは下顎、入れるときは上顎 → 逆にする）
      var swapped = text.replace(new RegExp(alt, "g"), function (m) { return m === a ? b : a; });
      if (swapped === text) continue;
      var to = first[0] === a ? b : a;
      return { text: swapped, from: first[0], to: to };
    }
    // 数字を変える（範囲「〜」の一部や「1960年代」「1回の」は変えない）
    var numRe = new RegExp("(^|[^0-9〜.])([0-9]+)(" + NUM_UNITS + ")(?!〜|代|の)");
    var nm = text.match(numRe);
    if (nm) {
      var n = parseInt(nm[2], 10);
      var alt2 = n >= 1900 ? n - 2 : n >= 100 ? n + Math.round(n * 0.2) : n >= 10 ? n + (n % 10 === 0 ? 10 : 5) : n + 1;
      var at = nm.index + nm[1].length;
      return { text: text.slice(0, at) + alt2 + text.slice(at + nm[2].length), from: nm[2] + nm[3], to: alt2 + nm[3] };
    }
    return null;
  }

  /** 用語の5択（基礎問題） */
  function buildTermItem(termId, dir) {
    var t = termById[termId].term;
    var options = [{ text: dir === "t2d" ? t.definition : t.term, correct: true, termId: termId }];
    var fake = dir === "t2d" ? makeFake(t.definition) : null;
    if (fake) options.push({ text: fake.text, correct: false, fake: fake });
    pickDistractors(termId, dir, CHOICES - options.length).forEach(function (id) {
      var o = termById[id].term;
      options.push({ text: dir === "t2d" ? o.definition : o.term, correct: false, termId: id });
    });
    return { kind: "term", termId: termId, dir: dir, options: shuffle(options), chosen: null };
  }

  function buildItems(termIds, dir) {
    return shuffle(termIds).map(function (id, i) {
      return buildTermItem(id, dir === "mix" ? (i % 2 ? "d2t" : "t2d") : dir);
    });
  }

  /** 過去問題の5択 */
  function buildExamItems(qids) {
    return shuffle(qids).map(function (qid) {
      var q = examById[qid];
      var options = q.c.map(function (text, i) { return { text: text, correct: i === q.a - 1 }; });
      return { kind: "exam", qid: qid, options: shuffle(options), chosen: null };
    });
  }

  function itemCorrect(item) {
    return item.chosen !== null && item.options[item.chosen].correct;
  }

  /**
   * quiz の種類
   *   theme  : テーマの全問（基礎問題）。結果をテーマの成績として保存する
   *   review : 過去に間違えた用語など、任意の用語の集合
   *   exam   : 過去問題（科目ごと・まとめて・間違えた問題）
   */
  function startQuiz(themeId) {
    var theme = themeById[themeId];
    quiz = {
      kind: "theme", themeId: themeId, termIds: themeTermIds(theme),
      title: theme.name, eyebrow: fieldOfTheme[themeId].name,
      dir: null, items: null, index: 0, saved: false, full: true,
    };
    go({ name: "quiz", themeId: themeId, ctx: "quiz" });
  }

  function startReviewQuiz(termIds, title, eyebrow) {
    quiz = {
      kind: "review", termIds: termIds, title: title, eyebrow: eyebrow,
      dir: null, items: null, index: 0, saved: false, full: false,
    };
    go({ name: "quiz", ctx: "review" });

  function startExam(qids, title, eyebrow, back) {

      kind: "exam", qids: qids, title: title, eyebrow: eyebrow, back: back || "exams",

      '<section class="section"><h2 class="section__label">' +

      (q ? '<p class="hint">' + icon("info") + "<span>前回 " + q.last + " / " + q.total + " 問正解 ・ 最高 " + q.best + "%</span></p>" : "") +
      '<div class="rows">' +
      opt("t2d", "用語を見て、説明を選ぶ", "一語だけ違う「ひっかけ」の説明が混ざります") +
      opt("d2t", "説明を見て、用語を選ぶ", "国家試験と同じく、説明から用語を思い出す") +

      "</div></section>" +
      (quiz.kind === "theme"
        ? '<button class="btn btn--ghost" data-action="open-theme" data-id="' + quiz.themeId + '">' + icon("grid") + "先に基礎学習で見る</button>"
        : "") +
      "</main>"
    );
  }

  function renderQuizQuestion() {
    var item = quiz.items[quiz.index];
    var answered = item.chosen !== null;
    var correct = itemCorrect(item);
    var n = quiz.items.length;
    var last = quiz.index === n - 1;
    var prompt, feedbackBody, sub = "";

    if (item.kind === "exam") {
      var q = examById[item.qid];
      sub = " ・ " + esc(fieldById[q.field].name) + (q.case ? " ・ 事例" : "");
      prompt = '<div class="q-prompt q-prompt--def">' + esc(q.q) + "</div>";
      var related = (q.termIds || []).map(function (id) { return termById[id].term.term; });
      feedbackBody =
        '<p class="q-feedback__term">正解：' + esc(q.c[q.a - 1]) + "</p>" +
        '<p class="q-feedback__def">' + esc(q.exp) + "</p>" +
        (related.length ? '<p class="q-feedback__point">関連する用語：' + related.map(esc).join("・") + "</p>" : "");
    } else {
      var entry = termById[item.termId];
      var t = entry.term;
      if (quiz.kind === "review") sub = " ・ " + esc(entry.theme.name);
      prompt = item.dir === "t2d"
        ? '<p class="q-label">この用語の説明として正しいものは？</p><div class="q-prompt q-prompt--term">' + esc(t.term) +
          (t.reading ? '<span class="q-prompt__reading">' + esc(t.reading) + "</span>" : "") + "</div>"
        : '<p class="q-label">この説明に当てはまる用語は？</p><div class="q-prompt q-prompt--def">' + esc(t.definition) + "</div>";
      var chosen = answered ? item.options[item.chosen] : null;
      feedbackBody =
        (chosen && chosen.fake
          ? '<p class="q-feedback__trap">ひっかけ：「' + esc(chosen.fake.to) + "」ではなく「" + esc(chosen.fake.from) + "」</p>"
          : "") +
        '<p class="q-feedback__term">' + esc(t.term) + "</p>" +
        (item.dir === "d2t" ? "" : '<p class="q-feedback__def">' + esc(t.definition) + "</p>") +
        (t.point ? '<p class="q-feedback__point">' + esc(t.point) + "</p>" : "");
    }

    var longText = item.kind === "exam" || item.dir === "t2d";
    var options = item.options.map(function (o, i) {
      var cls = "q-opt" + (longText ? " q-opt--def" : "");
      if (answered) {
        if (o.correct) cls += " is-correct";
        else if (i === item.chosen) cls += " is-wrong";
        else cls += " is-dim";
      }
      return (
        '<button class="' + cls + '" data-action="quiz-answer" data-index="' + i + '"' + (answered ? " disabled" : "") + ">" +
        '<span class="q-opt__num">' + (i + 1) + "</span>" +
        '<span class="q-opt__text">' + esc(o.text) + "</span>" +
        (answered && o.correct ? '<span class="q-opt__mark">' + icon("check") + "</span>" : "") +
        (answered && i === item.chosen && !correct ? '<span class="q-opt__mark">' + icon("close") + "</span>" : "") +
        "</button>"
      );
    }).join("");

    var feedback = answered
      ? '<div class="q-feedback ' + (correct ? "is-correct" : "is-wrong") + '" aria-live="polite">' +
        '<p class="q-feedback__verdict">' + (correct ? "正解" : "不正解") + "</p>" + feedbackBody + "</div>"
      : "";

    var dock = answered
      ? '<button class="btn btn--primary" data-action="quiz-next">' + (last ? "結果を見る" : "次の問題") + icon("arrow") + "</button>"
      : '<p class="dock__status">5つの選択肢から1つ選んでください</p>';

    return (
      topbar(quiz.eyebrow, quiz.title, "quiz-quit") +
      '<main class="content content--with-dock">' +
      '<div class="progress"><div class="progress__text"><span>第' + (quiz.index + 1) + "問" + sub + "</span>" +
      '<span class="progress__count"><b>' + (quiz.index + 1) + "</b> / " + n + "</span></div>" + bar(quiz.index + (answered ? 1 : 0), n) + "</div>" +
      prompt +
      '<div class="q-opts">' + options + "</div>" +
      feedback +
      "</main>" +
      '<div class="dock"><div class="dock__inner">' + dock + "</div></div>"
    );
  }

  function renderQuizResult() {

          '<span class="read-item__term">正解：' + esc(q.c[q.a - 1]) + "</span>" +
          '<span class="read-item__point">' + esc(q.exp) + "</span></div>"

      var t = termById[it.termId].term;
      return (
        '<div class="read-item read-item--static"><span class="read-item__term">' + esc(t.term) + "</span>" +

    var sub = quiz.kind === "theme"
      ? (quiz.full ? "全問に挑戦しました" : "間違えた問題の解き直し")
      : wrong.length ? "正解した問題は「まだ正解していない」から外れます" : "すべて正解しました";

    var buttons;
    if (quiz.kind === "theme") {
      buttons =
        '<button class="btn btn--ghost" data-action="quiz-again">もう一度全問解く</button>' +
        '<button class="btn btn--ghost" data-action="open-theme" data-id="' + quiz.themeId + '">' + icon("grid") + "基礎学習で見直す</button>" +
        '<button class="btn btn--text" data-action="back-themes">テーマ一覧へ</button>';
    } else if (quiz.kind === "exam") {
      buttons =
        '<button class="btn btn--ghost" data-action="quiz-again">同じ問題をもう一度解く</button>' +
        '<button class="btn btn--text" data-action="' + quizBackAction() + '">' + (quiz.back === "review" ? "過去に間違えた問題へ戻る" : "過去問題の一覧へ") + "</button>";
    } else {
      buttons =
        '<button class="btn btn--ghost" data-action="back-review">過去に間違えた問題へ戻る</button>' +
        '<button class="btn btn--text" data-action="home">ホームに戻る</button>';
    }

    return (
      topbar(quiz.eyebrow, quiz.title, quizBackAction()) +
      '<main class="content">' +
      '<section class="done-hero">' +
      '<div class="score"><b>' + score + "</b><span>/ " + n + "</span></div>" +
      '<h2 class="done-hero__title">' + (pct === 100 ? "全問正解" : "正答率 " + pct + "%") + "</h2>" +
      '<p class="done-hero__sub">' + sub + "</p>" +
      bar(score, n) + "</section>" +
      (wrong.length
        ? '<section class="section"><h2 class="section__label">間違えた問題（' + wrong.length + "）</h2>" +
          '<div class="read-list">' + list + "</div></section>"
        : "") +
      '<div class="btn-stack">' +
      (wrong.length ? '<button class="btn btn--primary" data-action="quiz-retry-wrong">' + icon("redo") + "間違えた問題を解き直す</button>" : "") +
      buttons +
      "</div></main>"
    );
  }

  function renderQuiz() {
    if (!quiz) return renderHome();
    if (!quiz.items) return renderQuizSetup();
    if (quiz.index >= quiz.items.length) return renderQuizResult();
    return renderQuizQuestion();
  }

  /* ---------------- 年度別の本試験（マークシート採点） ---------------- */
  var PAST = window.KAIGO_PAST_EXAMS || { years: [], groups: [] };
  var pastById = {};
  PAST.years.forEach(function (y) { pastById[y.id] = y; });

  function isRight(year, q, choice) {
    var a = year.answers[q - 1];
    return Array.isArray(a) ? a.indexOf(choice) !== -1 : a === choice;
  }
  function answerLabel(a) { return Array.isArray(a) ? a.join("・") : String(a); }

  /** 年度ごとの集計：採点済みの科目だけを数える */
  function pastSummary(year) {
    var rec = Store.getPast(year.id);
    var total = 0, answered = 0, gradedQ = 0, bySubject = [], byField = {};
    year.subjects.forEach(function (s, si) {
      var graded = !!rec.graded[si];
      var right = 0, done = 0;
      for (var q = s.from; q <= s.to; q++) {
        var c = rec.answers[q];
        if (c) done++;
        if (graded && c && isRight(year, q, c)) right++;
      }
      answered += done;
      if (graded) { total += right; gradedQ += s.to - s.from + 1; }
      bySubject.push({ graded: graded, right: right, done: done, count: s.to - s.from + 1 });
      byField[s.field] = { graded: graded, right: right };
    });
    var allGraded = bySubject.every(function (b) { return b.graded; });
    var groupsOk = PAST.groups.every(function (g) {
      return g.some(function (f) { return byField[f] && byField[f].right > 0; });
    });
    return { total: total, answered: answered, gradedQ: gradedQ, bySubject: bySubject, allGraded: allGraded, groupsOk: groupsOk };
  }

  /** 採点済みの本試験の、科目ごとの正誤（総合問題を除く） */
  function pastFieldStats() {
    var st = {};
    PAST.years.forEach(function (y) {
      var rec = Store.getPast(y.id);
      y.subjects.forEach(function (s, si) {
        if (!rec.graded[si] || s.field === "general") return;
        var r = st[s.field] || { right: 0, total: 0 };
        for (var q = s.from; q <= s.to; q++) {
          r.total++;
          if (rec.answers[q] && isRight(y, q, rec.answers[q])) r.right++;
        }
        st[s.field] = r;
      });
    });
    return st;
  }

  /** 採点済みで間違えた問題の一覧（年度・科目ごと） */
  function pastWrongList() {
    var list = [];
    PAST.years.forEach(function (y) {
      var rec = Store.getPast(y.id);
      y.subjects.forEach(function (s, si) {
        if (!rec.graded[si]) return;
        var qs = [];
        for (var q = s.from; q <= s.to; q++) if (!(rec.answers[q] && isRight(y, q, rec.answers[q]))) qs.push(q);
        if (qs.length) list.push({ year: y, subject: s, index: si, qs: qs });
      });
    });
    return list;
  }

  function renderPastYears() {
    return PAST.years.map(function (y) {
      var sm = pastSummary(y);
      var chip = sm.gradedQ
        ? '<span class="chip ' + (sm.allGraded ? (sm.total >= y.passing && sm.groupsOk ? "chip--done" : "chip--ng") : "chip--progress") + '">' +
          sm.total + "点</span>"
        : '<span class="chip">未挑戦</span>';
      return (
        '<button class="row" data-action="open-past-year" data-id="' + y.id + '">' +
        '<span class="row__body"><span class="row__title">' + esc(y.name) + "（" + esc(y.nendo) + "）</span>" +
        '<span class="row__sub">' + esc(y.date) + "実施 ・ 125問 ・ 合格点 " + y.passing + "点" +
        (sm.gradedQ ? " ・ 採点済み " + sm.gradedQ + "問" : "") + "</span>" +
        bar(sm.gradedQ, 125) + "</span>" +
        '<span class="row__aside">' + chip + icon("chev", "row__chev") + "</span></button>"
      );
    }).join("");
  }

  function renderPastYear() {
    var y = pastById[view.yearId];
    var sm = pastSummary(y);
    var verdict = sm.allGraded
      ? (sm.total >= y.passing && sm.groupsOk
          ? '<p class="verdict verdict--ok">合格基準に達しています</p>'
          : '<p class="verdict verdict--ng">' + (sm.total < y.passing ? "合格点まであと " + (y.passing - sm.total) + "点" : "得点のない科目群があります") + "</p>")
      : '<p class="verdict">全科目を採点すると、合格基準で判定します</p>';
    var rows = y.subjects.map(function (s, si) {
      var b = sm.bySubject[si];
      var chip = b.graded
        ? '<span class="chip ' + (b.right / b.count >= 0.6 ? "chip--done" : "chip--ng") + '">' + b.right + " / " + b.count + "</span>"
        : b.done ? '<span class="chip chip--progress">解答中 ' + b.done + "/" + b.count + "</span>" : '<span class="chip">未解答</span>';
      return (
        '<button class="row" data-action="open-past-sheet" data-index="' + si + '">' +
        '<span class="row__body"><span class="row__title">' + esc(s.name) + "</span>" +
        '<span class="row__sub">問題' + s.from + "〜" + s.to + "（" + b.count + "問）</span></span>" +
        '<span class="row__aside">' + chip + icon("chev", "row__chev") + "</span></button>"
      );
    }).join("");
    return (
      topbar("過去問題（本試験）", y.name + "（" + y.nendo + "）", "back-exams") +
      '<main class="content">' +
      '<div class="panel stats">' +
      '<div><p class="stat__label">得点</p><p class="stat__value">' + sm.total + "<small>/ 125</small></p></div>" +
      '<div><p class="stat__label">合格点</p><p class="stat__value">' + y.passing + "<small>点</small></p></div>" +
      '<div><p class="stat__label">採点済み</p><p class="stat__value">' + sm.gradedQ + "<small>問</small></p></div>" +
      bar(sm.total, 125) + "</div>" +
      verdict +
      '<p class="hint">' + icon("info") + "<span>" + (y.read
        ? "公式サイトでの公開が終わった回です。問題は" + esc(y.read.label) + "の掲載ページで読み、答えの番号をアプリで選んで採点します。"
        : "問題は試験センター公式サイトのPDFで読み、答えの番号をアプリで選んで採点します。") +
        "合格には、合格点に加えて11の科目群すべてで得点があることが必要です。</span></p>" +
      '<div class="rows">' + rows + "</div>" +
      '<p class="notice">正答は社会福祉振興・試験センター／厚生労働省が公表した正答によります。試験問題の著作権は社会福祉振興・試験センターに帰属します。</p>' +
      "</main>"
    );
  }

  function renderPastSheet() {
    var y = pastById[view.yearId];
    var s = y.subjects[view.subjectIndex];
    var rec = Store.getPast(y.id);
    var graded = !!rec.graded[view.subjectIndex];
    var right = 0, done = 0, n = s.to - s.from + 1;
    var rows = "";
    for (var q = s.from; q <= s.to; q++) {
      var c = rec.answers[q];
      if (c) done++;
      var ok = graded && c && isRight(y, q, c);
      if (ok) right++;
      var btns = "";
      for (var k = 1; k <= 5; k++) {
        var cls = "ms-btn";
        if (c === k) cls += " is-chosen";
        if (graded) {
          var correctK = isRight(y, q, k);
          if (correctK) cls += " is-answer";
          if (c === k && !correctK) cls += " is-wrong";
        }
        btns += '<button class="' + cls + '" data-action="past-mark" data-q="' + q + '" data-k="' + k + '"' + (graded ? " disabled" : "") +
          ' aria-label="問題' + q + "の" + k + '">' + k + "</button>";
      }
      rows +=
        '<div class="ms-row' + (graded ? (ok ? " is-ok" : " is-ng") : "") + '">' +
        '<span class="ms-q">問' + q + "</span>" +
        '<span class="ms-btns">' + btns + "</span>" +
        '<span class="ms-mark">' + (graded ? (ok ? "○" : "×") : "") + "</span></div>";
    }
    var dock = graded
      ? '<button class="btn btn--ghost" data-action="past-reset">' + icon("redo") + "解き直す</button>"
      : '<button class="btn btn--primary" data-action="past-grade"' + (done ? "" : " disabled") + ">" + icon("check") +
        "採点する（" + done + " / " + n + "問 解答）</button>";
    return (
      topbar(y.name + "（" + y.nendo + "）", s.name, view.from === "review" ? "open-review" : "back-past-year") +
      '<main class="content content--with-dock">' +
      (s.pdf
        ? '<a class="btn btn--ghost" href="' + esc(s.pdf) + '" target="_blank" rel="noopener">' + icon("doc") + "問題を開く（公式PDF）</a>"
        : '<a class="btn btn--ghost" href="' + esc(y.read.url) + '" target="_blank" rel="noopener">' + icon("doc") + "問題を開く（" + esc(y.read.label) + "）</a>") +
      (graded
        ? '<div class="panel ms-score"><b>' + right + "</b> / " + n + "問 正解" +
          '<span class="chip ' + (right / n >= 0.6 ? "chip--done" : "chip--ng") + '">' + Math.round((right / n) * 100) + "%</span></div>"
        : '<p class="hint">' + icon("info") + "<span>問題" + s.from + "〜" + s.to + "の答えを選んで「採点する」を押してください。</span></p>") +
      '<div class="ms-sheet">' + rows + "</div>" +
      "</main>" +
      '<div class="dock"><div class="dock__inner">' + dock + "</div></div>"
    );
  }

  /* ---------------- 過去問題 ---------------- */
  function examIdsOf(fieldId) { return examsByField[fieldId] || []; }
  function allExamIds() {
    return DATA.fields.reduce(function (acc, f) { return acc.concat(examIdsOf(f.id)); }, []);
  }

    var all = allExamIds();
