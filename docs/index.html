<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>見て覚える 介護福祉士 国家試験対策</title>
<meta name="description" content="介護福祉士国家試験の重要用語を1画面のカードで見て覚える学習アプリ。過去問5年分（解説つき）と練習問題つき">
<meta name="theme-color" content="#e6effa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#163a6b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="見て覚える">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@700&display=swap">
<style>
html { color-scheme: light; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout: 片手操作前提の1カラム。主要操作は画面下部、用語は2列タイルで位置を固定 */
:root {
  /* 白と青を基調。緑（確認済み・正解）と赤（不正解）は意味のある所だけに使う */
  --bg: #ffffff;
  --surface: #ffffff;
  --tint: #f2f7fd;
  --ink: #13243b;
  --muted: #586a82;
  --faint: #8797ad;
  --line: #d9e4f2;
  --accent: #1b5fb5;
  --accent-ink: #ffffff;
  --accent-soft: #e7f0fb;
  --brand: #1b5fb5;
  --brand-ink: #ffffff;
  --brand-muted: #c9dcf5;
  --ok: #1d8a52;
  --ok-ink: #ffffff;
  --ok-soft: #eaf6ef;
  --ok-line: #9fd2b6;
  --ng: #c2412d;
  --ng-soft: #fcefec;
  --ng-line: #eab4aa;
  --scrim: rgba(13, 30, 56, 0.42);
  --shadow: none;
  --shadow-sheet: 0 -8px 28px rgba(13, 30, 56, 0.16);

  --font: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
  --fs-xs: 11px;
  --fs-sm: 12.5px;
  --fs-md: 14px;
  --fs-lg: 15.5px;
  --fs-xl: 19px;
  --radius: 12px;
  --radius-sm: 9px;
  --app-max: 480px;
  --tap: 44px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1626;
    --surface: #142036;
    --tint: #18273f;
    --ink: #e4ecf7;
    --muted: #9db0c9;
    --faint: #6f84a1;
    --line: #243652;
    --accent: #7fb0f0;
    --accent-ink: #0b1a2f;
    --accent-soft: #1a2d4a;
    --brand: #163a6b;
    --brand-ink: #ffffff;
    --brand-muted: #a8c4ea;
    --ok: #4ec58a;
    --ok-ink: #0d1f15;
    --ok-soft: #132b20;
    --ok-line: #2e6a4a;
    --ng: #f0806c;
    --ng-soft: #2e1a17;
    --ng-line: #6e3a31;
    --scrim: rgba(0, 0, 0, 0.6);
    --shadow: none;
    --shadow-sheet: 0 -8px 28px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1626;
  --surface: #142036;
  --tint: #18273f;
  --ink: #e4ecf7;
  --muted: #9db0c9;
  --faint: #6f84a1;
  --line: #243652;
  --accent: #7fb0f0;
  --accent-ink: #0b1a2f;
  --accent-soft: #1a2d4a;
  --brand: #163a6b;
  --brand-ink: #ffffff;
  --brand-muted: #a8c4ea;
  --ok: #4ec58a;
  --ok-ink: #0d1f15;
  --ok-soft: #132b20;
  --ok-line: #2e6a4a;
  --ng: #f0806c;
  --ng-soft: #2e1a17;
  --ng-line: #6e3a31;
  --scrim: rgba(0, 0, 0, 0.6);
  --shadow: none;
  --shadow-sheet: 0 -8px 28px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: var(--fs-md);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body.is-locked { overflow: hidden; }
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--surface);
}
button { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; line-height: 1.35; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app {
  max-width: var(--app-max);
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ---------- Top bar ---------- */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding-block: 8px 12px;
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  align-items: center;
  gap: 4px;
}
.topbar__titles { min-width: 0; flex: 1; }
.topbar__eyebrow {
  font-size: var(--fs-xs);
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar__title { font-size: var(--fs-lg); font-weight: 700; }
.icon-btn {
  flex: none;
  width: var(--tap);
  height: var(--tap);
  border: 0;
  background: none;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--ink);
  cursor: pointer;
}
.icon-btn:active { background: var(--accent-soft); }
.icon-btn svg { width: 24px; height: 24px; }

.content {
  flex: 1;
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.content--with-dock { padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px)); }

.section { display: flex; flex-direction: column; gap: 10px; }
.section__label {
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--muted);
}

/* ---------- Home ---------- */
.home-head { display: flex; flex-direction: column; gap: 4px; padding-top: 8px; }
.home-head__eyebrow { font-size: var(--fs-sm); color: var(--muted); }
.home-head__title { font-size: 26px; font-weight: 700; letter-spacing: 0.02em; }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
}
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat__label { font-size: var(--fs-xs); color: var(--muted); }
.stat__value {
  font-size: 24px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.stat__value small { font-size: var(--fs-sm); color: var(--muted); font-weight: 400; margin-left: 2px; }
.stats .bar { grid-column: 1 / -1; }

.resume {
  display: flex;
  flex-direction: column;
  gap: 12px;
  border-color: var(--accent-soft);
  background: var(--surface);
}
.resume__meta { font-size: var(--fs-xs); color: var(--muted); }
.resume__title { font-size: var(--fs-lg); font-weight: 700; }

/* ---------- List rows ---------- */
.rows {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.row {
  width: 100%;
  border: 0;
  background: none;
  text-align: left;
  padding: 14px 12px 14px 16px;
  min-height: 64px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}
.row + .row { border-top: 1px solid var(--line); }
.row:active:not(:disabled) { background: var(--accent-soft); }
.row:disabled { cursor: default; }
.row:disabled .row__title { color: var(--faint); }
.row__icon {
  flex: none;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  background: var(--accent-soft);
  color: var(--accent);
  display: grid;
  place-items: center;
}
.row:disabled .row__icon { background: var(--bg); color: var(--faint); }
.row__icon svg { width: 20px; height: 20px; }
.row__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.row__title { font-size: var(--fs-md); font-weight: 700; }
.row__sub { font-size: var(--fs-xs); color: var(--muted); }
.row__chev { flex: none; color: var(--faint); width: 20px; height: 20px; }
.row__aside { flex: none; display: flex; align-items: center; gap: 4px; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: var(--fs-xs);
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 999px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  background: var(--bg);
  color: var(--muted);
}
.chip--progress { background: var(--accent-soft); color: var(--accent); }
.chip--done { background: var(--ok-soft); color: var(--ok); }
.chip svg { width: 12px; height: 12px; }

/* ---------- Progress bar ---------- */
.bar {
  height: 6px;
  border-radius: 999px;
  background: var(--line);
  overflow: hidden;
}
.bar__fill {
  height: 100%;
  border-radius: inherit;
  background: var(--accent);
  transition: width 0.3s ease;
}
.bar--done .bar__fill { background: var(--ok); }
.row .bar { margin-top: 4px; height: 4px; }

/* ---------- Study ---------- */
.study-head {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.page-tag {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}
.page-tag__num {
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.page-tag__title { font-size: var(--fs-lg); font-weight: 700; }
.page-tag__lead { font-size: var(--fs-xs); color: var(--muted); width: 100%; }
.progress {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.progress__text {
  display: flex;
  justify-content: space-between;
  font-size: var(--fs-sm);
  color: var(--muted);
}
.progress__count { font-variant-numeric: tabular-nums; color: var(--ink); }
.progress__count b { font-size: var(--fs-lg); }

.term-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.term-grid > .term:last-child:nth-child(odd) { grid-column: 1 / -1; }

.term {
  position: relative;
  min-height: 86px;
  padding: 14px 14px 12px;
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
  text-align: left;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  transition: border-color 0.2s, background-color 0.2s, transform 0.1s;
}
.term:active { transform: scale(0.98); }
.term__name {
  font-size: var(--fs-term);
  font-weight: 700;
  line-height: 1.3;
  padding-right: 22px;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
.term__reading { font-size: 11px; color: var(--faint); line-height: 1.3; }
.term__check {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  display: grid;
  place-items: center;
  color: transparent;
}
.term__check svg { width: 14px; height: 14px; }
.term.is-checked {
  border-color: var(--ok-line);
  background: var(--ok-soft);
  box-shadow: none;
}
.term.is-checked .term__check {
  background: var(--ok);
  border-color: var(--ok);
  color: var(--ok-ink);
}
.term.is-checked .term__reading { color: var(--muted); }
.term.just-checked .term__check { animation: pop 0.35s ease-out; }
@keyframes pop {
  0% { transform: scale(0.5); }
  70% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

.hint {
  font-size: var(--fs-xs);
  color: var(--muted);
  display: flex;
  gap: 6px;
  align-items: flex-start;
}
.hint svg { flex: none; width: 14px; height: 14px; margin-top: 2px; color: var(--faint); }
.notice {
  font-size: var(--fs-xs);
  color: var(--muted);
  border-top: 1px solid var(--line);
  padding-top: 12px;
}

/* ---------- Bottom dock ---------- */
.dock {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.dock__inner {
  max-width: calc(var(--app-max) - 32px);
  margin: 0 auto;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.dock__status { font-size: var(--fs-sm); color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- Buttons ---------- */
.btn {
  min-height: 52px;
  width: 100%;
  border: 0;
  border-radius: var(--radius-sm);
  padding: 0 20px;
  font-size: var(--fs-md);
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
}
.btn svg { width: 20px; height: 20px; }
.btn--primary { background: var(--accent); color: var(--accent-ink); }
.btn--ok { background: var(--ok); color: var(--ok-ink); }
.btn--ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn--text {
  background: none;
  color: var(--muted);
  min-height: 44px;
  font-weight: 400;
  font-size: var(--fs-sm);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.btn:active { filter: brightness(0.94); }
.btn-stack { display: flex; flex-direction: column; gap: 10px; }
.dock .btn { animation: rise 0.25s ease-out; }
@keyframes rise {
  from { transform: translateY(8px); opacity: 0.4; }
  to { transform: none; opacity: 1; }
}

/* ---------- Detail sheet ---------- */
.sheet-scrim {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: var(--scrim);
  animation: fade 0.2s ease-out;
}
.sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 41;
  max-width: var(--app-max);
  margin: 0 auto;
  max-height: calc(100% - 48px - env(safe-area-inset-top, 0px));
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  box-shadow: var(--shadow-sheet);
  display: flex;
  flex-direction: column;
  animation: slide 0.26s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.sheet__grip {
  width: 40px;
  height: 4px;
  border-radius: 999px;
  background: var(--line);
  margin: 8px auto 0;
}
.sheet__head {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding-block: 12px 4px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.sheet__titles { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding-top: 6px; }
.sheet__meta { font-size: var(--fs-xs); color: var(--muted); }
.sheet__term { font-size: 24px; font-weight: 700; }
.sheet__reading { font-size: var(--fs-sm); color: var(--faint); }
.sheet__body {
  overflow-y: auto;
  padding-block: 12px 16px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.sheet__label {
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--accent);
  margin-bottom: 4px;
}
.sheet__def { font-size: 16px; line-height: 1.85; }
.sheet__example {
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: var(--fs-sm);
  line-height: 1.75;
}
.sheet__example .sheet__label { color: var(--muted); }
.sheet__foot {
  border-top: 1px solid var(--line);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.sheet__done {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: var(--ok);
  font-size: var(--fs-sm);
  font-weight: 700;
  padding-bottom: 6px;
}
.sheet__done svg { width: 16px; height: 16px; }
@keyframes fade { from { opacity: 0; } }
@keyframes slide { from { transform: translateY(100%); } }

/* ---------- Complete ---------- */
.done-hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 8px;
  padding-top: 16px;
}
.done-hero__mark {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: var(--ok-soft);
  color: var(--ok);
  display: grid;
  place-items: center;
  margin-bottom: 4px;
}
.done-hero__mark svg { width: 32px; height: 32px; }
.done-hero__title { font-size: var(--fs-xl); font-weight: 700; }
.done-hero__sub { font-size: var(--fs-sm); color: var(--muted); }
.review { display: flex; flex-direction: column; gap: 16px; }
.review__group { display: flex; flex-direction: column; gap: 8px; }
.review__title { font-size: var(--fs-xs); color: var(--muted); font-weight: 700; }
.review__terms { display: flex; flex-wrap: wrap; gap: 6px; }
.review__term {
  font-size: var(--fs-sm);
  padding: 5px 10px;
  border-radius: 8px;
  background: var(--ok-soft);
  color: var(--ink);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- 表示切り替え ---------- */
.seg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  padding: 4px;
  background: var(--line);
  border-radius: 12px;
}
.seg__btn {
  min-height: 40px;
  border: 0;
  border-radius: 9px;
  background: none;
  color: var(--muted);
  font-size: var(--fs-sm);
  font-weight: 700;
  cursor: pointer;
}
.seg__btn[aria-pressed="true"] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow);
}

/* ---------- 説明つきで読む ---------- */
.read-list {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.read-item {
  width: 100%;
  border: 0;
  background: none;
  text-align: left;
  padding: 14px 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  cursor: pointer;
}
.read-item + .read-item { border-top: 1px solid var(--line); }
.read-item:active { background: var(--accent-soft); }
.read-item__head { display: flex; align-items: flex-start; gap: 10px; }
.read-item__term { flex: 1; min-width: 0; font-size: var(--fs-lg); font-weight: 700; line-height: 1.4; }
.read-item .term__check { position: static; flex: none; margin-top: 2px; }
.read-item.is-checked .term__check { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
.read-item__reading { font-size: 11px; color: var(--faint); }
.read-item__def { font-size: var(--fs-md); line-height: 1.8; }
.read-item__point {
  margin-top: 4px;
  font-size: var(--fs-sm);
  line-height: 1.7;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 8px;
  padding: 8px 10px;
}

/* ---------- シートの追加要素 ---------- */
.sheet__person {
  display: flex;
  gap: 10px;
  align-items: baseline;
  font-size: var(--fs-sm);
  font-weight: 700;
}
.sheet__person span {
  flex: none;
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 1px 6px;
}
.sheet__point {
  background: var(--accent-soft);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: var(--fs-md);
  line-height: 1.75;
  font-weight: 700;
}
.done-hero__tip { font-size: var(--fs-xs); color: var(--muted); max-width: 28em; }
.home-head__lead { font-size: var(--fs-sm); color: var(--muted); }

/* ---------- コンパクト表示（1画面に8枚を収める） ---------- */
.content--with-dock { gap: 14px; padding-top: 14px; }
.study-head { gap: 8px; }
.term-grid { gap: 8px; }
.term { min-height: 68px; padding: 10px 12px 9px; gap: 2px; border-radius: 12px; }
.term__name { font-size: clamp(16px, 4.4vw, 18px); padding-right: 0; }
.term__reading { font-size: 10.5px; }
.term__check { top: 8px; right: 8px; width: 20px; height: 20px; }
.term__check svg { width: 12px; height: 12px; }
.seg__btn { min-height: 36px; }
.term__name { word-break: normal; line-break: strict; overflow-wrap: break-word; text-wrap: balance; line-height: 1.3; }
/* チェック欄の余白は1行目だけに取る（2行目以降はカード幅いっぱいに使う） */
.term__name::before { content: ""; float: right; width: 18px; height: 1em; }

/* ---------- 基礎問題 ---------- */
.stat__value { font-size: 22px; }
.q-label { font-size: var(--fs-sm); color: var(--muted); font-weight: 700; }
.q-prompt {
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px 16px;
}
.q-prompt--term { font-size: 24px; font-weight: 700; line-height: 1.35; display: flex; flex-direction: column; gap: 4px; }
.q-prompt__reading { font-size: var(--fs-xs); color: var(--faint); font-weight: 400; }
.q-prompt--def { font-size: var(--fs-md); line-height: 1.85; }
.q-opts { display: flex; flex-direction: column; gap: 8px; }
.q-opt {
  width: 100%;
  min-height: 52px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  text-align: left;
  padding: 12px 12px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  cursor: pointer;
  font-size: var(--fs-lg);
  font-weight: 700;
  line-height: 1.45;
}
.q-opt--def { font-size: var(--fs-sm); font-weight: 400; line-height: 1.7; }
.q-opt:active:not(:disabled) { background: var(--accent-soft); }
.q-opt:disabled { cursor: default; }
.q-opt__num {
  flex: none;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--bg);
  color: var(--muted);
  font-size: var(--fs-xs);
  font-weight: 700;
  display: grid;
  place-items: center;
  margin-top: 1px;
  font-variant-numeric: tabular-nums;
}
.q-opt__text { flex: 1; min-width: 0; }
.q-opt__mark { flex: none; width: 22px; height: 22px; }
.q-opt__mark svg { width: 22px; height: 22px; }
.q-opt.is-correct { border-color: var(--ok); background: var(--ok-soft); }
.q-opt.is-correct .q-opt__num { background: var(--ok); color: var(--ok-ink); }
.q-opt.is-correct .q-opt__mark { color: var(--ok); }
.q-opt.is-wrong { border-color: var(--ng); background: var(--ng-soft); }
.q-opt.is-wrong .q-opt__num { background: var(--ng); color: var(--surface); }
.q-opt.is-wrong .q-opt__mark { color: var(--ng); }
.q-opt.is-dim { opacity: 0.55; }
.q-feedback {
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  border: 1px solid var(--ok-line);
  background: var(--ok-soft);
}
.q-feedback.is-wrong { border-color: var(--ng-line); background: var(--ng-soft); }
.q-feedback__verdict { font-size: var(--fs-sm); font-weight: 700; color: var(--ok); }
.q-feedback.is-wrong .q-feedback__verdict { color: var(--ng); }
.q-feedback__term { font-size: var(--fs-lg); font-weight: 700; }
.q-feedback__def { font-size: var(--fs-sm); line-height: 1.75; }
.q-feedback__point { font-size: var(--fs-sm); line-height: 1.7; color: var(--accent); font-weight: 700; }
.score { display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
.score b { font-size: 48px; line-height: 1; }
.score span { font-size: var(--fs-lg); color: var(--muted); }
.done-hero .bar { width: 100%; max-width: 280px; margin-top: 6px; }
.read-item--static { cursor: default; }
.read-item--static:active { background: none; }

/* ---------- 過去に間違えた問題・苦手傾向分析 ---------- */
.chip--ng { background: var(--ng-soft); color: var(--ng); }
.bar--ng .bar__fill { background: var(--ng); }
.section__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.link-btn {
  border: 0;
  background: none;
  color: var(--accent);
  font-size: var(--fs-sm);
  font-weight: 700;
  padding: 8px 0;
  min-height: 40px;
  cursor: pointer;
}
.review-sum { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.review-sum .btn { width: auto; }
.empty { display: flex; flex-direction: column; gap: 12px; }
.empty__title { font-size: var(--fs-lg); font-weight: 700; }
.empty__text { font-size: var(--fs-sm); color: var(--muted); line-height: 1.75; }
.advice {
  margin: 0;
  padding: 14px 16px 14px 32px;
  background: var(--accent-soft);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: var(--fs-sm);
  line-height: 1.75;
}
.focus {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.focus__head { display: flex; align-items: flex-start; gap: 10px; }
.focus__rank {
  flex: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: var(--fs-sm);
  font-weight: 700;
  display: grid;
  place-items: center;
}
.focus__titles { flex: 1; min-width: 0; }
.focus__meta { font-size: var(--fs-xs); color: var(--muted); }
.focus__title { font-size: var(--fs-lg); font-weight: 700; line-height: 1.4; }
.focus__terms { font-size: var(--fs-sm); font-weight: 700; line-height: 1.7; }
.focus__terms span {
  display: block;
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--ng);
}
.focus__why { font-size: var(--fs-sm); color: var(--muted); line-height: 1.7; }
.focus__actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn--sm { min-height: 44px; font-size: var(--fs-sm); padding: 0 10px; gap: 6px; }
.btn--sm svg { width: 16px; height: 16px; }
.meters { display: flex; flex-direction: column; gap: 14px; }
.meter { display: flex; flex-direction: column; gap: 6px; }
.meter__head { display: flex; justify-content: space-between; gap: 12px; font-size: var(--fs-sm); }
.meter__label { font-weight: 700; min-width: 0; }
.meter__value { font-weight: 700; font-variant-numeric: tabular-nums; }
.meter__sub { font-size: var(--fs-xs); color: var(--muted); }


/* ==========================================================================
   白と青のデザイン ・ コンパクト表示（スクロールを減らすための最終調整）
   ========================================================================== */
body { line-height: 1.55; }
body::before { background: var(--brand); }

/* 上部バー：青地に白文字 */
.topbar {
  background: var(--brand);
  color: var(--brand-ink);
  border-bottom: 0;
  padding-block: 4px 6px;
  min-height: 52px;
}
.topbar__eyebrow { color: var(--brand-muted); font-size: var(--fs-xs); }
.topbar__title { font-size: var(--fs-lg); line-height: 1.3; }
.topbar .icon-btn { color: var(--brand-ink); }
.topbar .icon-btn:active { background: rgba(255, 255, 255, 0.16); }
.icon-btn svg { width: 22px; height: 22px; }

.content { padding-block: 12px 20px; gap: 14px; }
.content--with-dock { padding-top: 10px; gap: 10px; padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
.section { gap: 6px; }
.section__label { color: var(--accent); letter-spacing: 0.06em; }

.panel { padding: 12px 14px; border-color: var(--line); }
.stats { gap: 8px; }
.stat__value { font-size: 20px; line-height: 1.3; }
.resume { gap: 8px; background: var(--tint); border-color: var(--line); }
.resume__title { font-size: var(--fs-md); }

.rows { border-color: var(--line); }
.row { min-height: 50px; padding: 9px 10px 9px 14px; gap: 10px; }
.row__icon { width: 30px; height: 30px; border-radius: 8px; }
.row__icon svg { width: 17px; height: 17px; }
.row__body { gap: 2px; }
.row__title { font-size: var(--fs-md); line-height: 1.4; }
.row__sub { line-height: 1.5; }
.row__chev { width: 18px; height: 18px; }
.row:disabled .row__icon { background: var(--tint); }
.row .bar { margin-top: 3px; height: 3px; }
.chip { padding: 2px 7px; background: var(--tint); }

.bar { height: 5px; background: var(--accent-soft); }

.btn { min-height: 46px; font-size: var(--fs-md); border-radius: var(--radius-sm); gap: 6px; }
.btn svg { width: 18px; height: 18px; }
.btn--ghost { background: var(--surface); border-color: var(--line); color: var(--accent); }
.btn--text { min-height: 36px; }
.btn-stack { gap: 8px; }
.btn--sm { min-height: 38px; }

.hint { font-size: var(--fs-xs); }
.notice { font-size: var(--fs-xs); padding-top: 8px; }

/* 基礎学習 */
.study-head { gap: 6px; }
.page-tag { gap: 6px; row-gap: 0; }
.page-tag__title { font-size: var(--fs-md); }
.progress { gap: 4px; }
.progress__text { font-size: var(--fs-xs); align-items: baseline; }
.progress__count b { font-size: var(--fs-md); }
.seg { padding: 3px; gap: 3px; background: var(--tint); border: 1px solid var(--line); border-radius: 10px; }
.seg__btn { min-height: 32px; font-size: var(--fs-sm); border-radius: 7px; }
.seg__btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.term-grid { gap: 7px; }
.term { min-height: 60px; padding: 8px 10px 7px; border-width: 1.5px; border-color: var(--line); border-radius: 10px; }
.term:not(.is-checked):active { border-color: var(--accent); background: var(--accent-soft); }
.term__check { top: 7px; right: 7px; width: 18px; height: 18px; }
.term__name::before { width: 16px; }
.term__reading { font-size: 10px; }
.dock { padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px)); border-top-color: var(--line); }
.dock__inner { min-height: 46px; }
.dock__status { font-size: var(--fs-xs); }

.read-item { padding: 10px 14px 12px; gap: 3px; }
.read-item__term { font-size: var(--fs-md); }
.read-item__def { font-size: var(--fs-sm); line-height: 1.7; }
.read-item__point { font-size: var(--fs-xs); padding: 6px 9px; margin-top: 2px; }

/* 説明シート */
.sheet__head { padding-block: 8px 0; }
.sheet__term { font-size: 20px; }
.sheet__body { padding-block: 8px 12px; gap: 12px; }
.sheet__def { font-size: var(--fs-md); line-height: 1.8; }
.sheet__point { padding: 10px 12px; font-size: var(--fs-sm); }
.sheet__example { padding: 10px 12px; }
.sheet__foot { padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px)); }

/* 完了・結果 */
.done-hero { padding-top: 4px; gap: 4px; }
.done-hero__mark { width: 44px; height: 44px; margin-bottom: 0; }
.done-hero__mark svg { width: 24px; height: 24px; }
.done-hero__title { font-size: var(--fs-xl); }
.score b { font-size: 40px; }
.review { gap: 10px; }
.review__term { font-size: var(--fs-xs); padding: 4px 8px; background: var(--tint); }

/* 基礎問題 */
.q-label { font-size: var(--fs-xs); }
.q-prompt { padding: 12px 14px; border-color: var(--line); }
.q-prompt--term { font-size: 20px; }
.q-prompt--def { font-size: var(--fs-md); line-height: 1.75; }
.q-opts { gap: 6px; }
.q-opt { min-height: 44px; padding: 8px 10px; gap: 8px; font-size: var(--fs-md); border-color: var(--line); border-radius: 10px; }
.q-opt--def { font-size: var(--fs-sm); line-height: 1.6; }
.q-opt__num { width: 22px; height: 22px; background: var(--tint); color: var(--accent); }
.q-opt__mark, .q-opt__mark svg { width: 20px; height: 20px; }
.q-feedback { padding: 10px 12px; gap: 4px; }
.q-feedback__term { font-size: var(--fs-md); }

/* 分析・復習 */
.advice { padding: 10px 12px 10px 28px; gap: 6px; font-size: var(--fs-sm); line-height: 1.65; background: var(--tint); border: 1px solid var(--line); }
.focus { padding: 12px 14px; gap: 8px; }
.focus__title { font-size: var(--fs-md); }
.focus__rank { width: 22px; height: 22px; font-size: var(--fs-xs); }
.meters { gap: 10px; }
.empty { gap: 10px; }
.empty__title { font-size: var(--fs-md); }
.link-btn { min-height: 32px; padding: 4px 0; }

/* ---------- 学習画面の見出し（1行にまとめる） ---------- */
.study-head { gap: 5px; }
.study-head__row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.study-head__row .page-tag__title { min-width: 0; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.study-head__row .progress__count { flex: none; font-size: var(--fs-xs); color: var(--muted); }
.study-head__row .progress__count b { color: var(--ink); font-size: var(--fs-md); }
.page-tag__lead { width: auto; }

/* ---------- 説明つきで読む：1画面のまとめシート ---------- */
.read-sheet {
  font-size: 14px; /* JS が画面に収まるサイズに調整する */
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  overflow: hidden;
}
.rs-item {
  position: relative;
  width: 100%;
  border: 0;
  background: none;
  text-align: left;
  font-size: inherit;
  padding: 0.5em 0.75em 0.55em;
  display: flex;
  flex-direction: column;
  gap: 0.15em;
  cursor: pointer;
}
.rs-item + .rs-item { border-top: 1px solid var(--line); }
.rs-item:active { background: var(--accent-soft); }
.rs-item.is-checked { background: var(--ok-soft); }
.rs-item__text { line-height: 1.5; padding-right: 1.4em; }
.rs-item__term {
  font-weight: 700;
  color: var(--accent);
  margin-right: 0.5em;
}
.rs-item.is-checked .rs-item__term { color: var(--ok); }
.rs-item__point {
  font-size: 0.9em;
  line-height: 1.45;
  color: var(--muted);
  padding-left: 0.6em;
  border-left: 2px solid var(--accent);
}
.rs-item__check {
  position: absolute;
  top: 0.55em;
  right: 0.6em;
  width: 1.15em;
  height: 1.15em;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  display: grid;
  place-items: center;
  color: transparent;
}
.rs-item__check svg { width: 0.75em; height: 0.75em; }
.rs-item.is-checked .rs-item__check { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
/* まとめシートの余白をさらに詰める（小さい画面でも1画面に収める） */
.rs-item { padding: 0.4em 0.65em 0.45em; gap: 0.1em; }
.rs-item__text { line-height: 1.45; }
.rs-item__point { line-height: 1.4; }
.content--with-dock .seg__btn { min-height: 30px; }
.content--read { gap: 7px; padding-top: 8px; }

/* ---------- ページの切り替え ---------- */
.page-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-top: 2px; }
.page-tabs::-webkit-scrollbar { display: none; }
.page-tab {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 30px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--muted);
  font-size: var(--fs-xs);
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}
.page-tab svg { width: 12px; height: 12px; color: var(--ok); }
.page-tab.is-current { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.page-tab.is-current svg { color: var(--accent-ink); }

/* ---------- まとめシート：右の丸でチェック ---------- */
.rs-item { flex-direction: row; align-items: stretch; gap: 0; padding: 0; cursor: default; }
.rs-item:active { background: none; }
.rs-item__body {
  flex: 1;
  min-width: 0;
  border: 0;
  background: none;
  text-align: left;
  font-size: inherit;
  color: inherit;
  padding: 0.4em 0.2em 0.45em 0.65em;
  display: flex;
  flex-direction: column;
  gap: 0.1em;
  cursor: pointer;
}
.rs-item__body:active { background: var(--accent-soft); }
.rs-item__text { padding-right: 0; }
.rs-item__check {
  position: static;
  flex: none;
  align-self: stretch;
  width: 2.6em;
  min-width: 36px;
  border: 0;
  border-radius: 0;
  background: none;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 0.45em;
  cursor: pointer;
  color: transparent;
}
.rs-item__check svg {
  width: 1.25em;
  height: 1.25em;
  padding: 0.18em;
  border-radius: 50%;
  border: 1.5px solid var(--faint);
  box-sizing: border-box;
}
.rs-item__check:active svg { border-color: var(--ok); }
.rs-item.is-checked .rs-item__check { background: none; }
.rs-item.is-checked .rs-item__check svg { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }

/* ---------- 5択 ---------- */
.q-feedback__trap { font-size: var(--fs-sm); font-weight: 700; color: var(--ng); }
.rs-item__check { width: 2.1em; min-width: 30px; }
.rs-item__body { padding-right: 0; }
.study-head__row { align-items: center; }
.study-head__row .page-tabs { flex: 1; min-width: 0; margin-top: 0; }
.page-tab { min-height: 28px; padding: 0 9px; }

/* ---------- 年度別の本試験：マークシート ---------- */
a.btn { text-decoration: none; }
.verdict { font-size: var(--fs-sm); font-weight: 700; color: var(--muted); text-align: center; }
.verdict--ok { color: var(--ok); }
.verdict--ng { color: var(--ng); }
.ms-score { display: flex; align-items: baseline; justify-content: center; gap: 8px; font-size: var(--fs-md); }
.ms-score b { font-size: 28px; font-variant-numeric: tabular-nums; }
.ms-sheet { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.ms-row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
.ms-row + .ms-row { border-top: 1px solid var(--line); }
.ms-row.is-ng { background: var(--ng-soft); }
.ms-q { flex: none; width: 3.6em; font-size: var(--fs-sm); font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.ms-btns { flex: 1; display: flex; justify-content: space-between; gap: 6px; max-width: 260px; }
.ms-btn {
  width: 38px; height: 38px; border-radius: 50%;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  font-size: var(--fs-md); font-weight: 700; cursor: pointer; font-variant-numeric: tabular-nums;
}
.ms-btn.is-chosen { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ms-btn:disabled { cursor: default; }
.ms-btn.is-answer { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.ms-btn.is-chosen.is-answer { background: var(--ok); color: var(--ok-ink); }
.ms-btn.is-wrong { background: var(--ng); border-color: var(--ng); color: var(--surface); }
.ms-mark { flex: none; width: 1.2em; text-align: center; font-weight: 700; }
.ms-row.is-ok .ms-mark { color: var(--ok); }
.ms-row.is-ng .ms-mark { color: var(--ng); }
.btn:disabled { opacity: 0.5; cursor: default; }
.rs-item__body { padding-top: 0.38em; padding-bottom: 0.42em; }

/* 過去問題の解説 */
.btn-row { display: flex; gap: 8px; }
.btn-row > .btn { flex: 1 1 0; min-width: 0; padding-left: 8px; padding-right: 8px; white-space: nowrap; }
.ex-list { display: flex; flex-direction: column; gap: 8px; }
.ex-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }

<script>
/**
 * 教材データの土台（画面のコードとは独立）
 *
 * 分野ごとの教材は src/data/fields/ に1ファイルずつ置き、defineField() で登録する。
 * 構造: field → themes[] → pages[] → terms[]
 *   - 1ページ = 基礎学習画面の1画面。スマホ1画面に収まる8語まで
 *   - term.id は進捗・正答率の記録キー。省略すると「テーマID.用語」で自動生成される
 *     （公開後に用語名を変えると記録が引き継がれない点に注意）
 *   - pages が空のテーマは「準備中」として表示される
 *
 * 収録方針: 介護福祉士国家試験に出る・出やすい内容だけを入れる。
 *   出ない／ほぼ出ない内容は、教科書に載っていても入れない。
 *   人物は出題が多い人に絞り、その他の人名は手法の「提唱者（person）」欄で扱う。
 *
 * term は次のどちらの書き方でもよい
 *   オブジェクト: { term, reading, definition, point, person, profile, example, id }
 *   配列（短縮形）: ["用語", "よみ", "説明", "覚えるポイント", { person: "提唱者" など任意 }]
 */
window.KAIGO_DATA = {
  version: 3,
  updated: "2026-11",
  disclaimer: "掲載内容は受験用テキスト・厚生労働省の資料・最新の法令と照合してご利用ください。",

  /** 試験科目の順（領域ごと） */
  areas: [
    { name: "人間と社会", fields: ["dignity", "relations", "society"] },
    { name: "介護", fields: ["care-basics", "comm-skills", "life-support", "care-process"] },
    { name: "こころとからだのしくみ", fields: ["development", "dementia", "disability", "body"] },
    { name: "医療的ケア", fields: ["medical"] },
  ],

  fields: [],
};

window.defineField = function (spec) {
  var area = window.KAIGO_DATA.areas.filter(function (a) {
    return a.fields.indexOf(spec.id) !== -1;
  })[0];
  spec.area = area ? area.name : "";

  spec.themes.forEach(function (theme) {
    theme.summary = theme.summary || "";
    theme.pages = (theme.pages || []).map(function (page, pi) {
      page.id = page.id || "p" + (pi + 1);
      page.terms = page.terms.map(function (t) {
        if (Array.isArray(t)) {
          var extra = t[4] || {};
          t = {
            term: t[0],
            reading: t[1] || "",
            definition: t[2],
            point: t[3] || "",
            person: extra.person,
            profile: extra.profile,
            example: extra.example,
          };
        }
        t.id = t.id || theme.id + "." + t.term;
        return t;
      });
      return page;
    });
  });

  window.KAIGO_DATA.fields.push(spec);
};

/** 全ファイル読み込み後に呼び、試験科目の順に並べる */
window.finalizeData = function () {
  var order = [];
  window.KAIGO_DATA.areas.forEach(function (a) { order = order.concat(a.fields); });
  window.KAIGO_DATA.fields.sort(function (a, b) {
    return order.indexOf(a.id) - order.indexOf(b.id);
  });
};

</script>

    "34": ["客観的事実は「朝食のパンを残した」こと。", 0, "誰が見ても確認できる事実と、推測や評価を分ける。"],
    "35": ["生活支援では、利用者の全体像をとらえて支援する。", 0, "できる力を生かし、できないところを補う。"],
    "36": ["快適な室内環境のため、風の通り道をつくって換気する。", 0, "温度・湿度・換気・照明・騒音を調整する。"],
    "37": ["パーキンソン病の人の住まいでは、廊下の床に歩幅に合わせた目印をつける。", 0, "すくみ足で一歩目が出にくい症状への工夫。"],
    "38": ["歩く意欲が低下した人には、達成できる歩行距離を目標にする。", 0, "成功体験を積み重ねて自信を回復させる。"],
    "39": ["車いすへの移乗では、立ち上がる前に前傾姿勢をとるよう促す。", 0, "前傾すると重心が前に移り立ち上がりやすい。"],
    "40": ["視覚障害者の誘導では、階段の前でいったん止まって声をかける。", 0, "段差や方向は事前に言葉で伝える。"],
    "41": ["ICFの心身機能・身体構造にあたるのは、体温を調整すること。", 0, "心身機能は体や心の働きそのもの。"],
    "42": ["口腔ケアでは、歯ブラシで歯を1本ずつ丁寧に磨く。", 0, "誤嚥性肺炎の予防につながる。"],
    "43": ["右片麻痺の人が上着を着るときは、右袖（患側）を肩まで通してから左袖を通す。", 0, "脱健着患。"],
    "44": ["施設の食事支援では、食事が楽しくなる雰囲気をつくる。", 0, "食事は栄養だけでなく楽しみの場。"],
    "45": ["椅子に座って食事をするときは、足底を床につけてもらう。", 0, "足底接地で姿勢が安定し、飲み込みやすい。"],
    "46": ["咀嚼機能が低下した人の一口量は、ティースプーンに軽く1杯が目安。", 0, "一口量を少なくし、食形態も調整する。"],
    "47": ["食事中にむせや呼吸の変化があったら、口腔の状況を観察する。", 0, "食事を中断して観察し、医療職に報告する。"],
    "48": ["ベッド上の陰部洗浄では、バスタオルで両下肢を包んで保温する。", 0, "露出を最小限にし、前から後ろへ洗う。"],
    "49": ["腹部の清拭は、腸の走行に沿って（「の」の字に）拭く。", 0, "腸の動きを促す。"],
    "50": ["頸髄損傷で電動車いすを使う人の入浴には、入浴用リフトを使う。", 0, "体を持ち上げて移動できる用具が適する。"],
    "51": ["排泄場所がわからない認知症の人には、トイレの出入口に「トイレ」と書いた紙を貼る。", 0, "目で見てわかる手がかりで自立を支える。"],
    "52": ["下痢のときは、白湯を少量ずつこまめに補給する。", 0, "冷たい飲み物やカフェイン、乳製品は避ける。"],
    "53": ["認知症の人の金銭管理は、お金の使い方を一緒に考えることを提案する。", 0, "一方的に管理せず、本人の意思決定を支える。"],
    "54": ["綿の柄物シャツには酸素系漂白剤を使う。", 0, "塩素系漂白剤は色柄物を脱色する。"],
    "55": ["生活援助では、購入した食材で調理しにくいものがないか確認する。", 0, "本人の主体性を尊重しながら確認する。"],
    "56": ["入浴は就寝の1〜2時間前に済ませる。", 0, "入浴後に体温が下がるときに眠気が起こる。"],
    "57": ["背中の重だるさを訴える人は、側臥位にしてクッションを抱いてもらう。", 0, "体位を整えて圧迫を減らし、苦痛を和らげる。"],
    "58": ["終末期の利用者には、好きなものを家族に持ってきてもらう。", 0, "その人らしさや安心感を支える。"],
    "59": ["遺族の悲嘆が長く続き生活に支障があるときは、専門医などへの相談を助言する。", 0, "グリーフケアの一つ。"],
    "60": ["固定式歩行器は、両手の握力があり、立位を保てる人に適する。", 0, "持ち上げて前に出すため、両手と立位の安定が必要。"],
    "61": ["比較的短時間で起こる強い感情の動きは情動。", 0, "長く続く弱い感情は気分。情動には扁桃体がかかわる。"],
    "62": ["セロトニンは神経伝達物質の一つ。", 0, "感情や睡眠にかかわる。"],
    "63": ["肺動脈には静脈血が流れる。", 0, "肺で酸素を受け取り、肺静脈には動脈血が流れる。"],
    "64": ["立位を保つときに収縮するのは大殿筋（抗重力筋）。", 0, "姿勢を保つ筋肉を知ると転倒予防に役立つ。"],
    "65": ["白内障では水晶体が混濁する。", 0, "視界がかすみ、まぶしく感じる。"],
    "66": ["低栄養の高齢者には、偏った食べ方がみられやすい。", 0, "体重減少や血清アルブミン値の低下も目安。"],
    "67": ["表皮の角質層がバリア機能を担う。", 0, "乾燥すると感染しやすくなるため保湿が大切。"],
    "68": ["食べ物を認識して食べようとする段階は先行期。", 0, "摂食・嚥下は先行期→準備期→口腔期→咽頭期→食道期。"],
    "69": ["横行結腸の次は下行結腸。", 0, "盲腸→上行→横行→下行→S状結腸→直腸。"],
    "70": ["急な便秘の変化や血便があるときは、医療機関の受診を勧める。", 0, "重大な病気の可能性があり、自己判断しない。"],
    "71": ["65歳以上の妥当な睡眠時間は約6時間。", 0, "加齢で深い睡眠が減り、睡眠時間も短くなる。"],
    "72": ["キューブラー・ロスの死の受容過程で「抑うつ」は4番目の段階。", 0, "否認→怒り→取り引き→抑うつ→受容。"],
    "73": ["ハヴィガーストの中年期の発達課題は、市民的・社会的責任の達成。", 0, "老年期は退職や配偶者の死への適応など。"],
    "74": ["自閉スペクトラム症の特徴は、同じ動作や行動を繰り返すこと（こだわり）。", 0, "対人関係やコミュニケーションの困難も特徴。"],
    "75": ["健康と要介護の中間の状態はフレイル。", 0, "栄養・運動・社会参加で健康な状態に戻れる可能性がある。"],
    "76": ["高齢女性は女性ホルモン（エストロゲン）の低下で性交痛を感じやすい。", 0, "高齢者にもセクシュアリティがあることを理解する。"],
    "77": ["同年代との交流を求める気持ちは、マズローの所属・愛情の欲求。", 0, "居場所づくりも支援の一つ。"],
    "78": ["階段で息切れしやすくなるのは、予備力の低下による。", 0, "加齢で負荷に対応する力が落ちる。"],
    "79": ["高齢者は複数の疾患をもちやすい。", 0, "症状が典型的でないことも多い。"],
    "80": ["皮膚の乾燥とかゆみ、掻いた痕があるのは老人性皮膚掻痒症。", 0, "保湿し、電気毛布など乾燥の原因を見直す。"],
    "81": ["病気がないのに重い病気だと思い込むのは心気妄想。", 0, "否定せず、不安の背景を受け止める。"],
    "82": ["認知症の本人同士が語り合い社会に発信する取り組みは本人ミーティング。", 0, "本人の声を施策に生かす。"],
    "83": ["出口を探して歩き回るのはBPSD（行動・心理症状）。", 0, "中核症状は記憶障害・見当識障害など。"],
    "84": ["アルツハイマー型認知症では、初期から記憶障害がみられる。", 0, "新しい出来事を覚えられない。"],
    "85": ["レビー小体型認知症では、自律神経症状として起立性低血圧がみられる。", 0, "転倒に注意し、立ち上がりを見守る。"],
    "86": ["買い物や服薬管理などの能力はIADL（手段的日常生活動作）。", 0, "ADLは食事・排泄・入浴など基本的な動作。"],
    "87": ["認知症の人の環境では、手すりに色をつけて目立たせる。", 0, "必要な情報をわかりやすく示す。"],
    "88": ["調理の手順を順序立てて行えないのは遂行機能障害（実行機能障害）。", 0, "工程を分けて見通しを示す。"],
    "89": ["日付や季節の話題、ホワイトボードで現実の情報を伝えるのはリアリティ・オリエンテーション。", 0, "訂正するのではなく安心できる形で伝える。"],
    "90": ["怒りや落ち込み、自責が入り混じる時期は、家族の受容過程の混乱期。", 0, "戸惑い・否定→混乱・怒り・拒絶→割り切り→受容。"],
    "91": ["障害の有無にかかわらず誰もが社会に包み込まれる考え方はソーシャルインクルージョン。", 0, "分けるのではなく、誰もが参加できる環境を整える。"],
    "92": ["知的障害は、発達期（おおむね18歳まで）にあらわれる。", 0, "知的機能と適応行動の困難がある。"],
    "93": ["脳血管障害の後遺症として、片麻痺や言語障害が起こる。", 0, "高次脳機能障害や嚥下障害も起こる。"],
    "94": ["国際障害者年（1981年）をきっかけに、ノーマライゼーションの理念が広まった。", 0, "テーマは「完全参加と平等」。"],
    "95": ["ALSでは嚥下障害が起こりやすい。", 0, "感覚や知能、眼球運動は保たれやすい。"],
    "96": ["精神科病院から地域生活に移るための支援は地域移行支援。", 0, "住まい探しや関係機関との調整を支える。"],
    "97": ["高次脳機能障害の社会的行動障害で怒りが出たときは、場面や話題を切り替える。", 0, "叱るより環境を調整する。"],
    "98": ["電動車いすは補装具にあたる。", 0, "補装具は自立支援給付の一つ。"],
    "99": ["地域生活支援事業は市町村が行う。", 0, "相談支援や移動支援などを地域の実情に応じて行う。"],
    "100": ["自助具の選定や食事動作の練習は作業療法士が担う。", 0, "理学療法士は基本動作、言語聴覚士は言語・嚥下。"],
    "101": ["非接触型体温計は、周囲の温度の影響を受けやすい。", 0, "数値だけでなく全身の状態と合わせて判断する。"],
    "102": ["サイドチューブ付きの気管カニューレでは、カフ上部にたまった分泌物を吸引できる。", 0, "誤嚥性肺炎の予防に役立つ。"],
    "103": ["右肺に痰がたまっているときは、左側を下にした体位で排痰を促す（体位ドレナージ）。", 0, "痰がたまっている側を上にする。"],
    "104": ["胃底部は、食べ物を一時的にためる部位。", 0, "胃の入口は噴門、出口は幽門。"],
    "105": ["胃ろうの周囲は、石けんとぬるま湯で洗い清潔を保つ。", 0, "発赤や漏れがあれば観察して報告する。"],
    "106": ["利用者が望む暮らしの実現を目指すことが、生活課題への対応になる。", 3, "他職種の都合を優先するのは利用者本位ではない。"],
    "107": ["短期目標は、アセスメントで明らかになった具体的な生活課題から考える。", 2, "1年後の状態を示すのは長期目標。"],
    "108": ["支援内容を利用者に説明し、同意を得てから実施する。", 1, "実施状況は評価日にまとめず、その都度記録する。"],
    "109": ["サービス担当者会議で、個別支援計画での取り組みを報告する。", 3, "支給決定は市町村が行うもので、会議の目的ではない。"],
    "110": ["自宅で暮らし続けたいという思いが本人のニーズ。", 1, "娘宅での同居は、本人が強く拒んでいる。"],
    "111": ["デイサービスでの様子を中心に再アセスメントする。", 4, "送迎担当者の印象は主観的で、状態把握の中心にならない。"],
    "112": ["自信をなくした理由を知ることが、日中活動を休む背景の理解につながる。", 2, "友人が訪ねた時間は、状態の理解に直接必要な情報ではない。"],
    "113": ["短期目標を、自室の整理整頓に見直す。", 4, "事業所の変更は、課題の解決に直接つながらない。"],
    "114": ["パーキンソン病の手足の震えは、ドーパミンの不足による。", 1, "メラトニンは睡眠にかかわるホルモン。"],
    "115": ["レビー小体型認知症の幻視を減らすため、カーテンを無地にして視覚的な刺激を減らす。", 4, "直接照明はまぶしさや影を生み、見間違いを招きやすい。"],
    "116": ["小規模多機能型居宅介護で、通い・訪問・泊まりを組み合わせて支える。", 3, "訪問介護だけでは、泊まりや通いによる交流を提供できない。"],
    "117": ["成年後見制度を利用して、財産管理を支援してもらう。", 2, "生活保護は最低生活の保障で、財産管理のしくみではない。"],
    "118": ["日常生活自立度Ⅲaは、日中を中心に日常生活に支障がある症状がみられ、介護が必要な状態。", 2, "見守りがあれば自立できるのはⅡの状態。"],
    "119": ["その人らしさを支えるケアへと介護計画を見直す。", 5, "BPSDをなくすことを目的にするのは、パーソン・センタード・ケアの考え方に合わない。"],
    "120": ["正常な便は、普通便〜やや軟らかい便（ブリストル便性状スケール3〜5）。", 1, "水様〜泥状は下痢便。"],
    "121": ["ヨーグルトを勧める（腸内環境を整え、便のにおいを抑える）。", 5, "アスパラガスはにおいを強めやすい。"],
    "122": ["協議会で、個別避難計画の遅れを地域の課題として検討するよう働きかける。", 4, "障害者政策委員会は国の審議機関で、地域課題を話し合う場ではない。"],
    "123": ["コーチングで、相手の気づきや振り返りを促す。", 4, "ティーチングは教えることが中心で、自分で振り返らせる関わりではない。"],
    "124": ["右上肢と右アームサポートの間にクッションを入れ、姿勢の傾きを支える。", 2, "左大腿部と座面の間では、右への傾きを支えられない。"],
    "125": ["同じ立場の家族が支え合う家族会を紹介する。", 5, "地域障害者職業センターは就労支援の機関。"]
  },
  "37": {
    "1": ["希望を言い出しにくい利用者の意思をくみ取り、実現に向けて働きかける。", 1, "同意を得る説明は説明責任であり、代弁（アドボカシー）の視点とは異なる。"],
    "2": ["利用者が依頼する理由をまず考える。", 4, "依頼を退けるのは、理由を確かめる前の判断で適切でない。"],
    "3": ["自己同一性の確立とは、自分が何者かという認識を持つこと。", 1, "他人と区別して意識するのは自己愛ではなく、自己愛は自分を大切に思う感情である。"],
    "4": ["あいづちで発話を引き出し、双方向のやり取りを目指す。", 1, "介護福祉職の自己開示が目的ではなく、利用者の発話を引き出すことが目的である。"],
    "5": ["キャリアパスの検討では、必要な能力や経験を明確にする。", 2, "業務マニュアルは業務の手順であり、キャリアの道筋ではない。"],
    "6": ["ユニットリーダーが気にしていることを詳しく聞き、状況を把握する。", 3, "状況把握の前に共有すると、情報の扱いとして不適切になるおそれがある。"],
    "7": ["社会福祉法人は評議員会を置く必要がある。", 1, "社会福祉法人の収益事業は禁止されておらず、一定の範囲で認められている。"],
    "8": ["定期巡回・随時対応型訪問介護看護は、日中も夜間もサービスを提供する。", 1, "利用定員9人以下の規定はなく、小規模型の制限とは無関係である。"],
    "9": ["生活に困窮したときに国が保障する生存権（憲法25条）が関係する。", 3, "財産権は財産の保障で、生活保護を受ける根拠とはならない。"],
    "10": ["保健所の業務には精神保健に関する事項が含まれる。", 5, "児童の一時保護は児童相談所の業務である。"],
    "11": ["地域包括支援センターは地域ケア会議を開催する。", 4, "介護認定審査会は市町村に置かれ、センターの業務ではない。"],
    "12": ["日中の話し相手を求めるBさんには、第一号通所事業（通所型サービス）が適する。", 4, "夜間対応型訪問介護は夜間の介護ニーズ向けで、日中の交流には合わない。"],
    "13": ["介護保険の財源は第1号と第2号の保険料を含む。", 3, "第2号保険料は医療保険料と合わせて徴収され、年金保険料とは合わせない。"],
    "14": ["2024年度の民間企業の法定雇用率は2.5%である。", 3, "2024年度の義務対象は従業員40人以上の事業主で、101人以上ではない。"],
    "15": ["短期入所は介護給付の一つである。", 1, "介護給付の支給には障害支援区分の認定が必要である。"],
    "16": ["保育所等訪問支援は、保育所などを訪問して集団生活への適応を支援する。", 2, "放課後等デイサービスは児童福祉法に基づく支援で、子ども・子育て支援法によるものではない。"],
    "17": ["サービス付き高齢者向け住宅は、高齢者住まい法に基づく住まいである。", 2, "入居は契約によるもので、市町村の措置ではない。"],
    "18": ["急性期の治療費は医療保険制度で支払う。", 1, "介護保険は介護サービスの費用を対象とし、治療の医療費は対象外である。"],
    "19": ["恐怖や不安などの情動には扁桃体が関わる。", 4, "海馬は記憶に関わる部位で、情動の中枢ではない。"],
    "20": ["顔の感覚を支配するのは三叉神経である。", 3, "顔面神経は表情筋を動かす運動神経で、顔の感覚は三叉神経が担う。"],
    "21": ["鼻毛は吸い込んだ塵や埃を除去する。", 5, "嗅細胞は鼻腔の上方（嗅粘膜）にあり、外鼻孔ではない。"],
    "22": ["歯周病では歯周ポケットが形成される。", 3, "歯髄炎は歯の神経部分の炎症で、歯周病の症状ではない。"],
    "23": ["口臭や「水分と一緒でないと飲み込みにくい」は唾液分泌の低下が考えられる。", 1, "歯の欠損や麻痺がないため、咀嚼の低下は示されていない。"],
    "24": ["外界と接するのは表皮である。", 2, "角質層は表皮にあり、真皮にはない。"],
    "25": ["高温浴では血圧が上昇する。", 4, "高温浴は交感神経を優位にし、副交感神経を亢進させるわけではない。"],
    "26": ["栄養素の大部分は小腸で吸収される。", 4, "横行結腸は主に水分を吸収する部位である。"],
    "27": ["レム睡眠中には記憶の整理と定着が行われる。", 5, "深い眠りはノンレム睡眠の特徴である。"],
    "28": ["睡眠中に下肢がぴくぴく動くのは周期性四肢運動障害の特徴である。", 3, "レストレスレッグス症候群では脚の不快感があり、事例では手足の異常を否定している。"],
    "29": ["呼吸中枢は延髄にある。", 2, "中脳は視覚や聴覚の反射などに関わり、呼吸中枢ではない。"],
    "30": ["脳機能停止の徴候は瞳孔散大と対光反射消失である。", 3, "心停止は全身の死の徴候であり、脳機能停止に特有の徴候ではない。"],
    "31": ["9か月から1歳ごろに指さしで自分の関心を伝えられるようになる。", 1, "ハイハイは生後7〜8か月ごろに始まるため、1歳半〜2歳ではない。"],
    "32": ["神経性無食欲症では活動性が高まることがみられる。", 3, "太ることへの強い恐怖がみられるのが特徴である。"],
    "33": ["老いへの不安から強く防衛する自己防衛（装甲）型に当たる。", 3, "円熟型は老いを受け入れる型で、老いへの不安や若さへのこだわりに合わない。"],
    "34": ["結晶性知能は、過去の知識や経験を活用して問題を解決する能力である。", 1, "新しい場面に素早く対応する力は流動性知能の説明である。"],
    "35": ["加齢で暗順応に時間がかかるようになる。", 2, "加齢では高音域の聴力から低下しやすい。"],
    "36": ["住み慣れた環境や仲間を失うことへの不安がみられる。", 4, "エイジズムの発言をしているのは息子で、本人にはみられない。"],
    "37": ["補聴器を使い、学習の場に参加することは社会参加につながる。", 2, "周囲との交流を避けることは、サクセスフル・エイジングに反する。"],
    "38": ["骨粗鬆症は老年症候群に直接関わる疾患である。", 4, "心筋梗塞は老年症候群ではなく、循環器疾患として扱われる。"],
    "39": ["認知症施策推進大綱は「共生」と「予防」を車の両輪として進める。", 2, "予防は「認知症にならない」ではなく、発症を遅らせ進行を緩やかにする意味である。"],
    "40": ["探す気持ちに寄り添い、一緒に探す声かけが適切である。", 1, "疑っているのかと問い返すと、利用者を責める印象を与える。"],
    "41": ["せん妄では原因となる要因を特定することが重要である。", 3, "せん妄は夜間に悪化しやすいという特徴がある。"],
    "42": ["アルツハイマー型認知症では初期から新しい記憶の障害がみられる。", 2, "幻視が特徴的なのはレビー小体型認知症である。"],
    "43": ["歯が少なくなり咀嚼機能が低下することは、認知症のリスクを高める要因とされる。", 4, "補聴器の使用はリスクを下げる要因である。"],
    "44": ["改訂長谷川式認知症スケール（HDS-R）は30点満点で、20点以下が認知症の目安である。", 1, "バーセルインデックスは日常生活動作（ADL）の評価尺度である。"],
    "45": ["意思表示として、身振りや表情の変化も読み取るよう努める。", 2, "意思決定支援者は特定の職種に限定されない。"],
    "46": ["回想法では昔の写真や音楽を活用して記憶を活性化する。", 2, "相手の現実を受け入れる関わりは、回想法ではなくバリデーションの考え方である。"],
    "47": ["認知症疾患医療センターは認知症の鑑別診断を行う。", 1, "実施主体は都道府県または指定都市であり、市町村ではない。"],
    "48": ["認知症初期集中支援チームは支援方針を検討する。", 3, "居宅サービス計画の作成は介護支援専門員の業務である。"],
    "49": ["社会（人生）レベルに当たるのは参加である。", 2, "活動は個人レベルの項目で、社会レベルではない。"],
    "50": ["エンパワメントとは、障害のある人が自らの能力や長所に気づき、課題に対応することである。", 1, "障害のない人と同等に生活する社会を目指すのはノーマライゼーションの考え方である。"],
    "51": ["クローン病では栄養障害がみられることが特徴的である。", 5, "関節痛は合併症として起こることがあるが、特徴的な症状とはいえない。"],
    "52": ["遂行機能障害では、行動を計画して実行することが難しくなる。", 1, "すぐに興奮して怒鳴るのは社会的行動障害で、遂行機能障害の特徴ではない。"],
    "53": ["白杖には、視覚に障害があることを周囲に知らせる役割がある。", 1, "ロービジョンは、見えにくさがあるものの一定の視覚情報が得られる状態である。"],
    "54": ["嚥下機能の低下がうかがえるため、誤嚥に留意する。", 3, "仮面様顔貌はパーキンソン病の特徴だが、食事時間や声の変化から優先されるのは誤嚥への対応である。"],
    "55": ["要約筆記によって、話の内容を文字にして意思疎通を補う。", 3, "フラッシュベルは音を光などで知らせる器具で、音を増幅する器具ではない。"],
    "56": ["発達障害の相談は発達障害者支援センターが担う。", 2, "難病情報センターは難病に関する情報提供を行う機関である。"],
    "57": ["知的障害者にはわかりやすい言葉で説明するのが合理的配慮である。", 3, "盲導犬の同伴を断るのは、補助犬の受け入れ拒否にあたり差別となる。"],
    "58": ["レスパイトケアでは、家族が休息している間も障害者が自分らしく過ごせるようにする。", 3, "家族が旅行などで休息することも、レスパイトケアの目的に含まれる。"],
    "59": ["呼吸が確認できない場合は、ただちに胸骨圧迫を始める。", 4, "圧迫の深さは約5cmが目安で、10cmは深すぎる。"],
    "60": ["痰は咳や咳払いによって排出される。", 5, "咳の中枢は下垂体ではなく延髄にある。"],
    "61": ["吸引チューブは回転させながら痰を吸引する。", 3, "口蓋垂まで挿入すると粘膜を傷つけたり嘔吐を誘発したりするため、深く入れすぎない。"],
    "62": ["腹部膨満感は、腹部が張る感覚のことである。", 5, "嘔気は吐き気の感覚であり、内容物を実際に吐き出すのは嘔吐である。"],
    "63": ["利用者の思いを医師や看護師に伝えて、相談につなげる。", 5, "経口摂取の可否は医療的判断が必要なため、介護福祉職が勝手に提案するのは不適切である。"],
    "64": ["介護保険制度は国民の共同連帯の理念に基づく。", 2, "障害者基本計画の策定は障害者基本法の規定で、障害者総合支援法ではない。"],
    "65": ["介護福祉士は信用を傷つける行為が禁じられている（信用失墜行為の禁止）。", 4, "秘密保持義務は、介護福祉士でなくなった後も続く。"],
    "66": ["利用者と一緒に夕食の準備をし、帰宅願望の背景にある思いに寄り添う。", 4, "向精神薬の服用の判断は医師が行うもので、介護福祉職は判断できない。"],
    "67": ["認知症カフェでの体操は、ICFの参加と活動の両方に関わる。", 4, "住環境の改修は環境因子への働きかけで、活動と参加の関連を示す例ではない。"],
    "68": ["利用者の習慣に合わせ、一緒に寝室を掃除する。", 1, "庭木の水やりは日常生活の援助の範囲外で、訪問介護の生活援助にならない。"],
    "69": ["労働安全衛生法は、事業者に年1回以上の健康診断を義務づけている。", 2, "労働条件の最低基準を定めるのは労働基準法で、労働者災害補償保険法ではない。"],
    "70": ["自助具の使用状況を確認し、自分で食事ができるよう支える。", 1, "母語の使用を制限するのは、本人の文化や言語の尊重に反する。"],
    "71": ["複数の専門職が共通の目標に向けて協働し、課題解決にあたる。", 4, "サービスの決定は、専門職ではなく本人の意向を中心に行う。"],
    "72": ["介護施設には、災害などに備えた業務継続計画（BCP）の策定が義務づけられている。", 3, "個別避難計画の作成は市町村の努力義務で、施設長の義務ではない。"],
    "73": ["結核の予防対策として、年1回の胸部X線検査が該当する。", 2, "肺炎球菌ワクチンは肺炎の予防が目的で、結核の予防対策ではない。"],
    "74": ["利用者の話をまとめて返し、気持ちの整理を助けるのが要約の技法。", 1, "開かれた質問は話を引き出す質問技法で、要約ではない。"],
    "75": ["利用者と家族の意向が異なるときは、家族と話す場を別に設けて思いを聴く。", 5, "家族を説得するのは、意向の調整として適切ではない。"],
    "76": ["ティッシュペーパーを渡して「足りますか」と言う人には、飲食店で会計をしている場面だと理解して、その世界に合わせて対応する。", 1, "本来の使い方を説明して訂正すると、本人の思いを否定することになる。"],
    "77": ["発音が不明瞭なため、短い言葉でゆっくり話してもらう。", 1, "言葉の理解の障害は示されておらず、会話は続けられる。"],
    "78": ["困りごとを受け止め、できることを一緒に考えると伝える。", 2, "説明書を見るよう繰り返すだけでは、本人の困りごとに応えていない。"],
    "79": ["利用者は、自分の記録の閲覧を請求することができる。", 4, "主観的情報と客観的事実は区別して記録する。"],
    "80": ["冬はトイレの温度を居室に近づけ、温度差による事故（ヒートショック）を防ぐ。", 3, "冷房使用時も換気は必要で、控えるべきではない。"],
    "81": ["アイスブレーキングは、参加者の緊張を和らげる効果がある。", 2, "活動内容を毎回固定することは、アイスブレーキングの目的ではない。"],
    "82": ["ベッド上の口腔ケアでは、ガーグルベースンを使ってうがいをする。", 2, "総義歯の洗浄に歯磨き剤を使うと、義歯を傷つける。"],
    "83": ["在宅酸素療法中の人のそばでは喫煙しないよう注意する（火気は2m以内に近づけない）。", 2, "認知症の人にガスコンロを用意すると、火災などの事故につながる。"],
    "84": ["右片麻痺の三動作歩行は、杖 → 右足（患側）→ 左足（健側）の順。", 2, "杖の次に健側の左足を出す順序は誤り。"],
    "85": ["端座位がとれる人は、スライディングボードを使って車いすに移乗する。", 1, "抱え上げる介助は腰への負担が大きく、ノーリフティングケアに反する。"],
    "86": ["健側の右肘を支点にして、上体を起こしてもらう。", 1, "左手は麻痺側のため、ベッド柵を握る支えにはできない。"],
    "87": ["歯みがきは口腔内の細菌を減らし、感染予防（誤嚥性肺炎の予防）につながる。", 3, "口腔内の乾燥は細菌の繁殖を促し、口臭の原因になる。"],
    "88": ["歯みがきの前にうがいをしてもらい、口腔内を潤す。", 1, "顎を上げた姿勢は誤嚥を招きやすく、顎を引いた姿勢が基本。"],
    "89": ["汗を多くかいたときは、塩分を含んだ飲み物を勧める。", 1, "喉の渇きを感じてから水分をとるのでは、脱水を防げない。"],
    "90": ["料理を少量ずつ盛りつけ、一度に多く口に入れないようにする。", 3, "すべての料理を並べると、次々に口に入れる行動を助長する。"],
    "91": ["片側の縁が高い皿を用意し、すくいやすくする。", 3, "上半身を後ろに倒すと誤嚥の危険がある。"],
    "92": ["浴槽内で関節を動かし、関節の柔軟性や血行の促進を図る。", 2, "42℃以上の高温浴は血圧を急上昇させ危険。"],
    "93": ["水平・垂直の手すりを設置し、浴槽の出入りを支える。", 1, "浴室の入口は開き戸より引き戸が安全。"],
    "94": ["蒸しタオルで拭いた後は、乾いたタオルで水分を拭き取る。", 4, "患側を下にすると麻痺側に体重がかかり負担が大きい。"],
    "95": ["おむつを使用する本人の羞恥心に配慮するよう説明する。", 3, "おむつは適切に交換し、長時間同じものを使うと皮膚トラブルの原因になる。"],
    "96": ["ポータブルトイレでは、前かがみの姿勢で座ってもらう（腹圧がかかりやすい）。", 2, "ベッドに寝たまま下着を下ろすと、転倒や事故につながりやすい。"],
    "97": ["排便を促す目的以外の坐薬は、排泄を済ませてから挿入する。", 1, "膣坐薬の挿入は、介護職が行える医薬品使用の介助に含まれない。"],
    "98": ["砂糖は塩より先に入れると、甘みが食材に浸透しやすい（さしすせその順）。", 2, "照りを出すのは主にしょうゆやみりんで、塩ではない。"],
    "99": ["りんごはビニール袋に入れて密封し、冷蔵保存する（エチレンガスが出るため）。", 2, "ウインナーの表示は一般に賞味期限で、消費期限ではない。"],
    "100": ["絹製品はタンスの上部に保管する。", 1, "防虫剤は衣類の上に置く（成分は空気より重く下に広がる）。"],
    "101": ["シーツをマットレスの下に入れ込むときは、手のひらを下に向ける。", 3, "シーツの中心線はマットレスの中央に合わせる。"],
    "102": ["午前中に日光を浴びてもらい、体内時計を整える。", 2, "長い昼寝は夜の睡眠を妨げるため、短時間にとどめる。"],
    "103": ["せん妄でつじつまが合わないときは、否定せず受け止める。", 1, "終末期は決まった時間ではなく、本人の状態に合わせて食事を提供する。"],
    "104": ["死が避けられないと知り、喪失感を抱く段階は「抑うつ」（キューブラー・ロス）。", 2, "「怒り」は「なぜ自分が」という感情が表れる段階。"],
    "105": ["携帯用会話補助装置で発話を補う。", 3, "人工喉頭は喉頭を摘出した人が使う用具で、事例の状態に合わない。"],
    "106": ["介護過程は、個別ケアに基づく利用者の自立支援を目的とする。", 1, "介護過程の中心は利用者の生活課題で、家族の課題ではない。"],
    "107": ["生活課題は、利用者のニーズを判断の基盤にして検討する。", 5, "生命の危機がある場合は、安全の確保が優先される。"],
    "108": ["介護過程の評価は、目標の達成状況を確認して行う。", 2, "評価で終わりではなく、次の計画へつなげる。"],
    "109": ["サービス提供責任者は、訪問介護計画の作成に必要な情報を確認する。", 1, "サービス担当者会議を開くのは介護支援専門員。"],
    "110": ["包丁を置いて横になったのは、調理がうまくできない苛立ちと解釈する。", 1, "バイタルサインに変化がなく、体調不良による休憩とは考えにくい。"],
    "111": ["調理用の福祉用具を活用し、自立した調理を目指す。", 2, "課題は担当者の交代で解決できるものではない。"],
    "112": ["ほかの利用者との関係が、一人でいた様子の要因と考えられる。", 5, "母親との関係は、今回の様子の理解には優先されない。"],
    "113": ["排泄の手順を理解できているか、定期的に一緒に確認する。", 3, "紙おむつを勧めるのは、本人の希望や自立の目標に反する。"],
    "114": ["方向転換が難しく急に止まれない（姿勢反射障害）のは、ホーエン・ヤール重症度分類のステージⅢ。", 2, "ステージⅡは両側に症状があるが、姿勢反射障害はみられない。"],
    "115": ["要介護認定の結果は申請から原則30日以内に出るため、もう少し待つよう伝える。", 4, "申請を二重に行うのは不要で、手続きの混乱を招く。"],
    "116": ["服薬の時間を医師に伝え、薬と症状の関係を確認してもらう。", 2, "起床時間は、症状の変化を判断する材料としての優先度が低い。"],
    "117": ["時間や場所がわからなくなるのは見当識障害。", 4, "遂行機能障害は、計画を立てて順序よく行うことが難しくなる症状。"],
    "118": ["ペットを大事にしたい本人の意思を尊重するよう、娘に提案する。", 4, "生きがいであるペットとの生活を、優先度の低いニーズとして扱うのは不適切。"],
    "119": ["ペットと暮らせる希望に沿う施設として、介護付有料老人ホームが選ばれる。", 2, "介護医療院は長期療養と医療が中心で、本人の希望に合わない。"],
    "120": ["筋ジストロフィーでは、筋線維の変性・壊死が起こる。", 2, "運動神経の変性はALSの病態で、筋ジストロフィーではない。"],
    "121": ["ジェノグラムから、本人に息子がいることが読み取れる。", 4, "死亡した人は×などの記号で示され、ここでは父親は死亡している。"],
    "122": ["介助を受けながらでも自分で選んで決めることを自立とする考え方は、IL運動のエド・ロバーツらが広めた。", 4, "バイステックは援助関係の7原則を示した人。"],
    "123": ["施設入所支援と組み合わせて日中に利用するサービスは、生活介護。", 5, "居宅介護は、施設入所支援と併用できない。"],
    "124": ["感音性難聴の損傷部位は、内耳から聴神経・脳にかけて。", 3, "耳介は外耳で、伝音性難聴にかかわる部位。"],
    "125": ["一対一で向かい合い、表情や口の動きが見えるように話す。", 3, "感音性難聴では大声にするほど聞き取りやすくなるわけではなく、はっきりゆっくり話す。"]
  },
  "36": {
    "1": ["まず本人の生活への思いを聞く。", 1, "すでに要支援1の認定を受けており、要介護認定の申請を勧めるのは的外れ。"],
    "2": ["精神的自立とは、目標をもって主体的に生活に取り組むこと。", 1, "自立は支援を受けないことではなく、支援を受けながら自分で決めて生活することも含む。"],
    "3": ["担当以外の職員もカンファレンスに参加し、目標を共有する。", 3, "内集団バイアスは身内びいきの偏りで、情報共有の目的に反する。"],
    "4": ["準言語（声の大きさ・速さ）を活用し、大きな声でゆっくり伝える。", 5, "早口は聞き取りにくく、理解を妨げる。"],
    "5": ["職員の精神的健康を守るため、バーンアウト（燃え尽き症候群）を防ぐ。", 2, "多職種連携は職員の精神的健康を守る取り組みそのものではない。"],
    "6": ["指揮命令系統は組織図で確認する。", 2, "勤務表は勤務の割り振りを示すもので、指揮命令の関係は示さない。"],
    "7": ["断酒会は、同じ問題を抱える当事者同士のセルフヘルプグループ。", 3, "子ども食堂は支援者が提供する活動で、当事者グループではない。"],
    "8": ["NPO法人の活動は、保健・医療・福祉の増進が最も多い。", 4, "NPO法人も収益事業を行うことができる。"],
    "9": ["19世紀後半、貧困地域に住み込んで住民を支援した活動はセツルメント。", 4, "生活協同組合は組合員の相互扶助の事業。"],
    "10": ["社会福祉基礎構造改革で、地域福祉権利擁護事業（現在の日常生活自立支援事業）が創設された。", 2, "改革で措置制度から利用契約制度へ移行した（逆ではない）。"],
    "11": ["75歳以上は後期高齢者医療制度の対象。", 3, "退職後は共済組合の被保険者ではない。"],
    "12": ["都道府県等が指定・監督するのは施設サービス。", 1, "地域密着型サービスの指定・監督は市町村。"],
    "13": ["障害者差別解消法は、障害者基本法の差別禁止の理念を具体化するために制定された。", 3, "個人の差別行為に対する罰則規定はない。"],
    "14": ["重度訪問介護は、重度障害者の外出時の移動中の支援も行う。", 2, "視覚障害者の外出支援は同行援護で、行動援護は知的・精神障害のある人が対象。"],
    "15": ["悪質な勧誘や契約トラブルの相談先は消費生活センター。", 3, "運営適正化委員会は福祉サービスの苦情を扱う機関。"],
    "16": ["介護老人福祉施設の入所者は、原則として福祉避難所の対象外（施設内で対応する）。", 2, "福祉避難所は介護保険法ではなく災害対策の制度に基づく。"],
    "17": ["結核の公費負担の申請や家庭訪問指導は保健所が担う。", 1, "基幹相談支援センターは障害者の相談支援の中核機関。"],
    "18": ["生活困窮や家賃滞納の相談先は福祉事務所。", 1, "地域包括支援センターは高齢者が対象。"],
    "19": ["マズローの成長欲求にあたるのは自己実現欲求。", 1, "承認欲求は欠乏欲求に含まれる。"],
    "20": ["交感神経は血管を収縮させる。", 2, "交感神経は心拍数を増加させる（減少ではない）。"],
    "21": ["日光浴でビタミンDがつくられ、骨粗鬆症の進行予防になる。", 5, "骨の健康にかかわるのはビタミンDやKで、ビタミンAではない。"],
    "22": ["中耳にある耳小骨はツチ骨・キヌタ骨・アブミ骨。", 2, "蝶形骨は頭蓋底の骨。"],
    "23": ["爪の主成分はたんぱく質（ケラチン）。", 2, "爪は1日に約0.1mm伸びる。"],
    "24": ["食物が気管に入ることを誤嚥という。", 5, "咽頭は食物と空気の共通の通り道で、誤嚥で入り込む先ではない。"],
    "25": ["食事中に喉をつかむしぐさ（チョークサイン）は窒息のサイン。", 3, "誤嚥性肺炎は数日かけて発熱や咳が現れる。"],
    "26": ["入浴で体が軽く感じるのは浮力作用。", 1, "静水圧作用は水圧で体が締めつけられる作用。"],
    "27": ["女性は尿道が短く直線的なため、尿路感染症を起こしやすい。", 4, "女性ホルモンは感染の主な要因ではない。"],
    "28": ["就寝前の飲酒は眠りを浅くする。", 5, "足浴は入眠を助ける。"],
    "29": ["概日リズム睡眠障害では、夕方に強い眠気があり深夜に目が覚めるなど体内時計がずれる。", 2, "睡眠中に下肢がぴくつくのは周期性四肢運動障害。"],
    "30": ["モルヒネ使用中は呼吸の状態を観察する（呼吸抑制）。", 2, "モルヒネの副作用は下痢ではなく便秘。"],
    "31": ["スキャモンの発育曲線で、生殖器系は12歳頃から急速に発達する。", 2, "4歳頃に急速に発達するのは神経系（脳）。"],
    "32": ["前日に、砂場が使えないことを具体的に予告しておく（見通しを示す）。", 4, "当日の急な変更は混乱を強めやすい。"],
    "33": ["生理的老化は遺伝的にプログラムされた現象で、誰にでも起こる。", 2, "生理的老化は訓練で元に戻るものではない。"],
    "34": ["エイジズムとは、高齢を理由にした偏見や差別。", 2, "高齢でも生産的に活動するという考え方はプロダクティブ・エイジング。"],
    "35": ["冷や汗を伴う激しい胸痛が続くときは心筋梗塞が疑われる。", 3, "脳梗塞は片麻痺や言語障害などの神経症状が中心。"],
    "36": ["健康寿命は、健康上の問題で日常生活が制限されることなく生活できる期間。", 3, "平均余命から単純に差し引いたものではない。"],
    "37": ["前立腺肥大症では初期に頻尿（特に夜間頻尿）がみられる。", 5, "骨盤底筋訓練は主に腹圧性尿失禁の対策。"],
    "38": ["腰部脊柱管狭窄症では、下肢のしびれや間欠性跛行がみられる。", 2, "変形性膝関節症ではO脚になりやすい。"],
    "39": ["75歳以上は免許更新時に認知機能検査を受ける。", 2, "運転技能検査は一定の違反歴がある人が対象で、全員の義務ではない。"],
    "40": ["アパシーは、意欲や感情の起伏がみられない状態。", 3, "気持ちが落ち込み、つらさを感じるのはうつ状態。"],
    "41": ["せん妄は、発熱や脱水など体調の変化が引き金になりやすい。", 2, "せん妄は意識障害で、「意識は清明」は誤り。"],
    "42": ["レビー小体型認知症ではパーキンソン症状で、最初の一歩が出にくく小刻みに歩く。", 3, "酔ったような歩行は小脳の障害でみられる。"],
    "43": ["若年性認知症は、就労支援が必要になることが多い。", 1, "進行が緩やかとはいえない。"],
    "44": ["配偶者が浮気していると思い込むのは嫉妬妄想。", 1, "誤認は人や物を取り違える症状。"],
    "45": ["相貌失認では、目の前の家族の顔を見ても誰かわからない。", 1, "自宅の場所がわからないのは見当識障害で、遂行機能障害ではない。"],
    "46": ["バリデーションで、相手の動きや感情に合わせる技法はミラーリング（4）とカリブレーション（5）。公式に複数正答。", 3, "レミニシング（思い出話）は動きや感情を合わせる技法ではない。"],
    "47": ["まず本人が訴えている内容を理解することを優先する。", 5, "薬の効果の検討は、本人の訴えや背景を理解した後のこと。"],
    "48": ["妻の数日間の入院中は、短期入所生活介護（ショートステイ）を利用する。", 3, "グループホームは継続して暮らす場で、数日間の利用にはなじまない。"],
    "49": ["ノーマライゼーションの理念を盛り込んだ1959年法を最初に制定したのはデンマーク。", 4, "スウェーデンではない（ニィリエが8つの原理に整理）。"],
    "50": ["成年後見人等は家庭裁判所が選任する。", 4, "市町村長は申立てはできるが、選任はしない。"],
    "51": ["障害を受容すると、できることに目を向けて行動するようになる。", 2, "周囲に不満をぶつけるのは受容より前の段階の反応。"],
    "52": ["統合失調症の特徴的な症状は妄想（陽性症状）。", 4, "抑うつ気分は気分障害の特徴。"],
    "53": ["末梢神経障害のある糖尿病の人は、足先の傷や壊疽に注意する。", 3, "振戦や筋固縮はパーキンソン病の症状。"],
    "54": ["ALSでも感覚は保たれ、身体の痛みはわかる。", 4, "ALSでは呼吸筋が弱り、自分で痰を出しにくくなる。"],
    "55": ["社会福祉協議会による金銭管理の支援は日常生活自立支援事業。", 2, "自立生活援助は一人暮らしを支える障害福祉サービス。"],
    "56": ["休憩時間の調整など、個別の柔軟な配慮は合理的配慮。", 1, "全人間的復権はリハビリテーションの理念。"],
    "57": ["サービス等利用計画案を作成するのは相談支援専門員。", 2, "社会福祉士は要件として定められた職種ではない。"],
    "58": ["家族の介護力は、家族一人ひとりと家族全体の生活の両面から見る。", 3, "家族の共通部分だけを見ると、個々の課題を見落とす。"],
    "59": ["喀痰吸引等を行う事業所は、登録の際に医療関係者との連携体制を確保する。", 4, "医療的ケアの指示は医師から受けるもので、介護支援専門員ではない。"],
    "60": ["気管は空気の通り道。", 3, "食べ物の通り道は食道。"],
    "61": ["吸引器は、使用前に陰圧がかかることを確認する。", 2, "吸引びんは滅菌が必須ではなく、清潔に管理する。"],
    "62": ["注入速度が速いと、嘔吐や下痢を起こすことがある。", 1, "チューブの誤挿入では肺への誤注入が危険。"],
    "63": ["腹部膨満を訴えたら、腹部が圧迫されていないかを確認する。", 2, "仰臥位は逆流や誤嚥のリスクを高める。"],
    "64": ["家族が担ってきた介護を、社会で代わって担う必要が生じた（介護の社会化）。", 2, "要介護認定者数は制度導入以降、増え続けている。"],
    "65": ["介護福祉士は信用を傷つける行為が禁じられている。", 1, "療養上の世話や診療の補助は看護師の業務の定義。"],
    "66": ["個人情報保護の研修を定期的に行い、職員の意識を高める。", 1, "パスワードを共有して誰でも閲覧できるようにするのは漏えいのもと。"],
    "67": ["生活習慣は、その人が生活してきた環境から理解する。", 3, "生活歴は成人期以降だけでなく、幼少期を含めて把握する。"],
    "68": ["同じ体験をしている人と交流できる場の情報を提供する。", 5, "長女の心理的な孤立が課題で、サービスの変更では解決しない。"],
    "69": ["入浴補助用具（特定福祉用具販売）を勧め、本人の力を生かす。", 3, "行動援護は障害福祉の外出支援で、入浴の課題には合わない。"],
    "70": ["民生委員は、住民の立場で相談に応じ、社会福祉の増進に努める。", 5, "介護支援専門員の主な役割はケアプランの作成。"],
    "71": ["警戒レベル3（高齢者等避難）では、上の階への垂直避難を誘導する。", 2, "避難の場面で初期消火を優先するのは誤り。"],
    "72": ["排泄の介護では、利用者ごとに手袋を交換する。", 5, "うがい用のコップは共用せず、個別に用意する。"],
    "73": ["副作用の知識をもって服薬の介護を行う。", 3, "薬の一包化は薬剤師が行うもので、介護福祉士の業務ではない。"],
    "74": ["マスク着用時は、目元を意識した笑顔と大きなうなずきで共感を示す。", 4, "言葉で伝えるのは非言語コミュニケーションではない。"],
    "75": ["家族の介護体験を共感的に聴く。", 5, "制度の説明は有益だが、信頼関係づくりの中心ではない。"],
    "76": ["言語障害のある人には「お風呂、あした」と短い言葉で伝える。", 4, "長い文で言い換えると理解の負担が大きい。"],
    "77": ["「とてもつらいのですね」と気持ちに共感する。", 3, "理由を問いただすと責められているように感じる。"],
    "78": ["驚かせたことを詫び、一緒に歩くことを提案する。", 3, "気持ちを受け止める前に点字の練習を勧めるのは不適切。"],
    "79": ["事例検討の目的は、事例の課題をチームで共有し、解決策を見いだすこと。", 3, "チームの交流は副次的な効果。"],
    "80": ["レクリエーションに買い物や調理など生活の活動も取り入れる。", 1, "全員参加を重視するのではなく、個々の意向を尊重する。"],
    "81": ["関節リウマチの人には、握らずに使える平手すりを勧める。", 2, "いすの座面は低いと立ち上がりにくく、高めがよい。"],
    "82": ["車いすを使う居室の床は、板製床材（フローリング）にする。", 1, "砂利敷きは車いすや歩行が不安定になる。"],
    "83": ["背上げの前に、臀部をベッドの曲がる部分に合わせる（ずり落ち防止）。", 4, "足をフットボードに付けるまで下げると、ずり落ちやすい。"],
    "84": ["左片麻痺の人の立ち上がりでは、左膝頭に手を当てて膝折れを防ぐ。", 1, "介助者は麻痺側（左側）に立つ。"],
    "85": ["車いすでエレベーターには正面からまっすぐ入る。", 2, "急な下り坂は後ろ向きで進む。"],
    "86": ["爪を切った後は、やすりをかけて滑らかにする。", 1, "爪は入浴後の柔らかいときに切る。"],
    "87": ["左片麻痺の人は、左足を右大腿の上にのせてズボンを通す（着患）。", 2, "麻痺側の動きを支える手順になっていない。"],
    "88": ["嚥下機能が低下した人のおやつはプリン（まとまりやすい）。", 4, "餅は窒息の危険が高い。"],
    "89": ["食べ残しが目立つときは、管理栄養士と連携する。", 5, "摂食・嚥下訓練は主に言語聴覚士の領域。"],
    "90": ["血液透析の人には、ゆでこぼした野菜を勧める（カリウムを減らす）。", 4, "透析中は水分制限があり、多く飲むのは逆効果。"],
    "91": ["浴槽内では、足で浴槽の壁を押して姿勢を安定させる。", 1, "右片麻痺の人は健側の左足から浴槽に入る。"],
    "92": ["椅座位の足浴では、足底が容器の底に付いていることを確認する。", 2, "湯温は介護者が先に確認する。"],
    "93": ["ストレッチャー浴で背部を洗うときは側臥位にする。", 4, "首までつかると心臓や肺への負担が大きい。"],

    "95": ["夜間のトイレが間に合わない人には、夜間だけポータブルトイレを勧める。", 2, "終日リハビリパンツにすると排泄の自立を妨げる。"],

    "99": ["高額請求に困っている夫婦と、契約内容を一緒に確認する。", 1, "本人の物を勝手に処分するのは不適切。"],
    "100": ["消化管ストーマの人は、寝る前にパウチにたまった便を捨てる。", 4, "パウチの上から強く圧迫すると漏れや皮膚トラブルの原因。"],
    "101": ["いびきと日中のだるさがある人は、睡眠中の呼吸状態を最優先に確認する（睡眠時無呼吸症候群の疑い）。", 4, "足の動きは周期性四肢運動障害の観察点。"],
    "102": ["終末期の人には、経口摂取に対する本人の意向をまず確認する。", 4, "家族の意向より本人の意思が優先。"],
    "103": ["デスカンファレンスは、亡くなった利用者の事例を振り返り今後の介護に生かす。", 2, "終末期の介護の検討は別のカンファレンスの目的。"],
    "104": ["複数の福祉用具は、状況に合わせた組み合わせを考える。", 1, "福祉用具と住宅改修は組み合わせて検討する。"],
    "105": ["握力が低下した人には、前腕で支えられるタイプなど握力に頼らない杖を選ぶ（図の問題）。", 1, "細く握りにくい杖は支えにならない。"],
    "106": ["初回面談では、目的を意識しながら話を聴く。", 1, "用意した項目を次々に質問するだけでは思いを引き出せない。"],
    "107": ["評価では利用者の満足度も踏まえる。", 1, "状況が変われば評価日を待たずに見直す。"],
    "108": ["介護福祉職は、生活状況の変化に関する情報を提供する。", 2, "総合的な支援の方向性を決めるのは介護支援専門員などチーム全体。"],
    "109": ["行動の意味を解釈するには「あの子たちが待っているの」という本人の発言が手がかり。", 5, "建物の位置関係では本人の思いはわからない。"],
    "110": ["大正琴を教える役割をもってもらう（経験を生かした役割）。", 4, "エレベーター前に座れる場所を作るのはその場しのぎ。"],
    "111": ["大声を出した理由は、組立て作業の状況から解釈する。", 2, "将来の希望は背景情報で、直接の場面ではない。"],
    "112": ["完成までの手順をわかりやすく示す。", 4, "横で指示し続けると主体性を損なう。"],
    "113": ["事例研究では、研究内容を説明して事例対象者の同意を得る。", 4, "論文を引用するときは引用元を明記する。"],
    "114": ["代金を払わず商品を持ち去るのは脱抑制（前頭側頭型認知症など）。", 2, "記憶の問題ではなく、社会的な規範に従えない行動。"],
    "115": ["介護保険の利用者負担は原則1割（所得により2割・3割）。", 4, "2割は一定以上の所得がある人。"],
    "116": ["八百屋への協力依頼は、参加への影響を意図した環境因子への働きかけ。", 5, "個人因子に働きかけるのではない。"],
    "117": ["在宅復帰を目指してリハビリを行う施設は介護老人保健施設。", 3, "介護老人福祉施設は生活の場。"],
    "118": ["居宅介護住宅改修費の支給限度基準額は20万円。", 2, "15万円ではない。"],
    "119": ["外出時は、事前に多機能トイレの場所を確認しておく。", 2, "車いすの種類は一律に決めるものではない。"],
    "120": ["アテトーゼ型脳性麻痺では、首の不随意運動による二次障害として頸椎症性脊髄症が起こりやすい。", 4, "脊柱側弯症は首の動きによる二次障害とは結びつかない。"],
    "121": ["自分で飲めるよう、ストローつきコップに変更する。", 5, "全介助は本人の自立を奪う。"],
    "122": ["趣味の教室への外出の付き添いは移動支援（地域生活支援事業）。", 1, "自立生活援助は一人暮らしの定期巡回支援。"],
    "123": ["自傷・他害などが激しく特別な支援が必要な状態は強度行動障害。", 2, "注意欠陥多動性障害は不注意・多動・衝動性が特徴。"],

    "125": ["施設入所後の支援の見直しには、計画相談支援（サービス等利用計画のモニタリング）を使う。", 3, "地域移行支援は施設から地域生活への移行の支援。"]

  "35": {
    "1": ["QOLを高める福祉用具の活用は、利用者と相談しながら進める。", 1, "QOLはADLの向上だけで決まるものではない。"],
    "2": ["初めての場所に不安がある人とは、交通経路や会場の状況を一緒に確認する。", 1, "参加を諦めさせるのは本人の意向の尊重に反する。"],
    "3": ["問題焦点型コーピングは、ストレスの原因に働きかけて解決を図る。", 5, "物事の受け止め方を変えるのは情動焦点型コーピング。"],
    "4": ["入所時の信頼関係づくりでは、自分から進んで自己紹介する。", 5, "孫のような口調は、大人の利用者に対して不適切。"],
    "5": ["PDCAのA（改善）として、来客用の駐車スペースを確保する。", 5, "交通量の調査は現状把握の段階。"],
    "6": ["先輩職員が移乗介助に同行して指導するのはOJT。", 2, "外部研修はOff-JT。"],
    "7": ["地域福祉の推進を目的とする団体は社会福祉協議会。", 3, "地域包括支援センターは介護保険法に基づく高齢者の相談機関。"],
    "8": ["制度や分野を超えて支え合う包摂的な地域づくりは地域共生社会。", 3, "介護の社会化は介護保険導入時の考え方。"],
    "9": ["1950年の社会保障制度審議会勧告は、社会保障を社会保険・国家扶助・公衆衛生及び医療・社会福祉で構成した。", 3, "介護保険は1997年制定で、勧告には含まれない。"],
    "10": ["要介護状態区分の変更の申請先は保険者（市町村）。", 3, "介護保険審査会は不服申立てを扱う機関。"],
    "11": ["聴覚障害のある人には、口頭の説明内容を書面で渡す（合理的配慮）。", 5, "問題の読み上げは視覚障害のある人への配慮。"],
    "12": ["2011年の障害者基本法改正で、社会的障壁の除去が規定された。", 5, "オリンピック・パラリンピックの開催は法律に規定されていない。"],
    "13": ["障害者総合支援法の介護給付は、まず市町村に支給申請をする。", 4, "障害支援区分の認定は申請の後。"],
    "14": ["居宅介護の利用者負担は、負担能力に応じた応能負担。", 3, "費用の一定割合を負担するのは応益負担の考え方。"],
    "15": ["個人情報の第三者提供は、原則として本人の同意が必要。", 2, "マイナンバーなどの個人識別符号も個人情報に含まれる。"],
    "16": ["虐待を発見した養介護施設従事者には、市町村への通報義務がある。", 1, "高齢者虐待防止法の対象は養護者と養介護施設従事者等で、病院は含まれない。"],
    "17": ["母親の介護保険サービスの情報を得るため、地域包括支援センターを勧める。", 4, "施設入所を勧めるのは、二人で暮らしたい希望を無視している。"],
    "18": ["生活困窮者自立支援法の対象は、最低限度の生活を維持できなくなるおそれのある人。", 5, "生活保護が最後のセーフティネットで、本法はその手前の支援。"],
    "19": ["老いを受け入れて前向きに過ごすのは、ライチャードの円熟型。", 5, "依存型（安楽いす型）は他者に頼って過ごす型。"],
    "20": ["後頭葉には視覚野がある。", 5, "感覚性言語野（ウェルニッケ野）は側頭葉にある。"],
    "21": ["大腿四頭筋は立位を保つ抗重力筋。", 2, "大胸筋は上肢の動きにかかわる。"],
    "22": ["廃用症候群では、うつ状態が起こり得る。", 4, "徘徊は認知症の行動・心理症状。"],
    "23": ["褥瘡は仰臥位では仙骨部に最も多い。", 2, "頸部は好発部位ではない。"],
    "24": ["歯周病は口臭の原因になりやすい。", 1, "唾液が減ると口臭が起きやすく、増えることは原因にならない。"],
    "25": ["誤嚥を防ぐために、まず座位の姿勢を整える。", 4, "全量摂取できており、食事量の調整は優先されない。"],
    "26": ["誤嚥しやすい人の脱水予防では、摂取している水分の形状（とろみなど）を確認する。", 3, "睡眠時間は優先して確認する事項ではない。"],
    "27": ["上行結腸の次は横行結腸。", 4, "下行結腸は横行結腸の後。"],
    "28": ["高齢者の睡眠薬は、翌朝まで作用が残ることがある（転倒に注意）。", 4, "アルコールとの併用は作用を強めて危険。"],
    "29": ["大切な人を亡くした後の心身の反応はグリーフ（悲嘆）。", 4, "スピリチュアルは生きる意味などにかかわる側面。"],
    "30": ["死が近づくと喘鳴がみられることがある。", 1, "死が近づくと瞳孔は散大する。"],
    "31": ["母親の表情を見て行動を決めるのは社会的参照。", 2, "愛着は養育者との情緒的な絆。"],
    "32": ["コールバーグの最も高い段階は、普遍的な倫理原則に従って判断する。", 4, "損得で判断するのは初期の段階。"],
    "33": ["体重が出生時の約2倍になるのは生後3か月頃。", 2, "1歳頃に約3倍になる。"],

    "35": ["意味記憶は加齢の影響を受けにくい。", 1, "エピソード記憶は加齢で低下しやすい。"],
    "36": ["加齢により尿の濃縮力が低下する。", 5, "高齢者は薬の排出に時間がかかる。"],
    "37": ["変形性膝関節症は女性に多い。", 4, "正座は膝への負担が大きい。"],
    "38": ["高齢者の脱水では体重が減ることがある。", 2, "高齢者は体内の水分量が若年者より少ない。"],
    "39": ["認知症施策推進大綱の柱の一つは「普及啓発・本人発信支援」。", 5, "認知症カフェの全市町村普及は柱ではない。"],
    "40": ["今いる場所を尋ねるのは見当識の確認。", 2, "100から7を引く問いは注意・計算力の確認。"],
    "41": ["物盗られ妄想は、本人の不安から生じることが多い。", 1, "説明しても誤りに気づきにくい。"],
    "42": ["慢性硬膜下血腫は、抗凝固薬の使用がリスクになる。", 2, "頭蓋骨骨折を伴うとは限らず、軽い打撲でも起こる。"],
    "43": ["日常生活自立支援事業では、生活支援員が公共料金の支払いを代行できる。", 1, "申込み窓口は社会福祉協議会で、家庭裁判所ではない。"],
    "44": ["ユマニチュードの「立つ」は、立位をとる機会をつくること。", 2, "「話す」は大声ではなく、穏やかに話しかけ続ける。"],
    "45": ["認知症サポーターのステップアップ講座修了者は、チームオレンジへの参加が期待される。", 5, "養成講座の実施主体は自治体など。"],
    "46": ["認知症ケアパスは、状態に応じたサービス提供の流れをまとめたもの。", 2, "介護保険のサービスではなく、市町村が作る情報。"],
    "47": ["認知症ライフサポートモデルは、本人の自己決定を支えることを重視する。", 2, "終末期だけでなく早期からの支援を想定している。"],
    "48": ["裁縫の手順を体が覚えているのは手続き記憶。", 2, "展望的記憶は将来の予定の記憶。"],
    "49": ["ストレングスの視点は、個人の特性や強さを見つけて生かす支援。", 3, "全人間的復権はリハビリテーションの理念。"],
    "50": ["1960年代アメリカの自立生活運動（IL運動）は、自分で意思決定して生活することを自立とした。", 2, "地位や特権の回復は運動の中心ではない。"],
    "51": ["著しい暴言は心理的虐待。", 3, "性的虐待は性的な行為の強要など。"],
    "52": ["上田敏の障害受容の受容期は、価値観を転換し積極的な生活態度になる段階。", 2, "障害の否認は受容より前の段階。"],
    "53": ["頸髄損傷では四肢麻痺が起こる。", 4, "腰髄損傷では主に下肢の麻痺（対麻痺）。"],
    "54": ["学習障害は、読む・書く・計算するなどの習得に困難がある。", 2, "不注意・多動はADHDの特徴。"],
    "55": ["脊髄小脳変性症のふらつきは運動失調。", 5, "筋固縮はパーキンソン病の症状。"],
    "56": ["本人自身が物事を決め、実行できるように関わる。", 2, "代わりに手続きを進めると主体性を損なう。"],
    "57": ["協議会には、地域の社会資源の開発が期待される。", 5, "基幹相談支援センターの運営評価は中心的な役割ではない。"],
    "58": ["障害福祉サービスでは、相談支援専門員がサービス担当者会議を開催する。", 4, "38歳で介護保険の対象外のため、地域包括支援センターはかかわらない。"],
    "59": ["滅菌物には有効期限がある。", 1, "消毒はすべての微生物を死滅させるものではない（それは滅菌）。"],
    "60": ["成人の正常な呼吸は、胸腹部が一定のリズムで膨らんだり縮んだりする。", 4, "1分間に40回は頻呼吸（成人の正常は12〜20回程度）。"],
    "61": ["喀痰吸引の説明は、吸引のたびに行う。", 4, "他の利用者から見える状態で行うのはプライバシーに反する。"],
    "62": ["胃ろうで口から食べなくても、口腔ケアは必要。", 3, "胃ろうでも便秘は起こる。"],
    "63": ["経管栄養中に嘔吐したら、誤嚥を防ぐため顔を横に向ける。", 4, "意識がある人に胸骨圧迫は行わない。"],
    "64": ["利用者主体の対応として、煮物の好みの切り方を利用者に確認する。", 1, "職員の判断だけで窓を開けたままにするのは利用者主体に反する。"],
    "65": ["介護福祉士は介護職の中核的な役割を担うことが求められる。", 2, "身体的支援と心理・社会的支援はどちらも必要。"],
    "66": ["介護福祉士には、知識と技能の向上に努める責務がある（資質向上の責務）。", 4, "介護保険の費用負担は介護福祉士の責務ではない。"],
    "67": ["意思決定支援として、サービスを変更したい理由を本人に確認する。", 1, "本人が望まないのに夫を同席させるのは意向に反する。"],
    "68": ["誰にでも使いやすい社会や製品の考え方はユニバーサルデザイン。", 2, "インフォームド・コンセントは説明に基づく同意。"],
    "69": ["家に帰りたいと訴える人には「家のことが気になるんですね」と気持ちを受け止める。", 2, "「ここが家ですよ」は本人の思いを否定している。"],
    "70": ["聴覚障害者標識（ちょうちょう型）を付けた運転手には、手話や筆談で話しかける。", 3, "拡大読書器は視覚障害のある人の支援機器。"],
    "71": ["施設サービス計画は介護支援専門員が作成する。", 3, "療養上の世話や診療の補助は看護職の業務。"],
    "72": ["チームアプローチでは、メンバーの役割分担を明確にする。", 4, "方針は医師だけでなく多職種で協議して決める。"],
    "73": ["危険回避のため、姿勢が傾いてきた利用者の姿勢を直す。", 2, "ふらつく利用者を放置すると転倒の危険がある。"],
    "74": ["「この本は好きですか」は「はい・いいえ」で答えられる閉じられた質問。", 5, "「なぜそう思いますか」は開かれた質問。"],
    "75": ["家族との信頼関係は、話し合いの機会を丁寧にもって築く。", 4, "一方的な指示は信頼関係を損なう。"],
    "76": ["老人性難聴の人とは、正面で向き合って話しかける。", 3, "耳元での大声は音がひずんで聞き取りにくい。"],
    "77": ["重度の認知症の人とは、表情やしぐさから感情の理解に努める。", 4, "視線が合わないからと会話を控えると、関わりが減る。"],
    "78": ["申し送りの目的は、利用者へのケアの継続性を保つこと。", 5, "方針の共有も大切だが、主な目的は継続性。"],
    "79": ["報告は、本人の言動を事実のまま客観的に伝える。", 3, "「もの盗られ妄想がある」は職員の解釈で、事実ではない。"],
    "80": ["おやつ作りをきっかけに、施設生活に楽しみをもてるよう計画する。", 1, "居室に限定するのは、台所を使いたい希望に合わない。"],
    "81": ["高齢者の安全な階段には手すりを設置する。", 2, "一段の高さが高すぎるとつまずきの原因になる。"],
    "82": ["安定した歩行のため、後ろ足のつま先で地面を蹴って踏み出す。", 1, "歩幅を極端に狭くすると安定しない。"],
    "83": ["片麻痺の人が溝をまたいだ後は、両足をそろえてもらう。", 2, "杖を溝の手前に突くと不安定になる。"],
    "84": ["総義歯は毎食後に外して洗う。", 4, "熱湯につけると義歯が変形する。"],
    "85": ["爪に異常（巻き爪や炎症など）があるときは切らずに、サービス提供責任者に報告する。", 3, "炎症のある部位を温めて切ると悪化させる。"],
    "86": ["臥床したまま上着を脱ぐときは、まず健側の肩口を広げておく。", 4, "患側から脱がせるのは脱健着患の原則に反する。"],

    "89": ["逆流性食道炎の人には、食事を回数に分けて少量ずつ食べるよう勧める。", 4, "前かがみで腹圧がかかる姿勢は逆流を悪化させる。"],
    "90": ["ベッド上の洗髪では、シャンプー後にタオルで泡を拭き取ってからすすぐ。", 3, "生え際から頭頂部に向かって洗う。"],

    "93": ["胃・結腸反射を利用するため、起床後に冷水を飲んでもらう。", 3, "胃・結腸反射は胃に食べ物や水が入ることで起こる。"],
    "94": ["便失禁の改善には、朝食後に時間を決めてトイレへ誘導する。", 4, "下剤の中止は医師が判断する。"],

    "98": ["弱視の人の調理では、よく使う調理器具をいつも同じ場所に収納する。", 4, "まな板は食材と対照的な色のほうが見分けやすい。"],
    "99": ["関節リウマチの人がテーブルを拭くときは、手掌基部を使う。", 4, "指先で瓶のふたを開けると関節に負担がかかる。"],

<script>
/**
 * 学習進捗ストア（端末内の localStorage に保存）
 *
 * 将来のバックエンド移行・機能追加を想定し、画面からはこの API だけを使う。
 *   - checked:   用語ごとの「確認した」日時
 *   - themes:    テーマごとの完了日時・完了回数
 *   - last:      続きから学習するための位置
 *   - history:   学習イベントの記録（学習履歴・苦手分析の元データ）
 */
window.KaigoStore = (function () {
  var KEY = "kaigo-study.progress.v1";
  var HISTORY_LIMIT = 500;

  function empty() {
    return { version: 1, checked: {}, themes: {}, last: null, history: [] };
  }

  function read() {
    try {
      var raw = window.localStorage.getItem(KEY);
      if (!raw) return empty();
      var parsed = JSON.parse(raw);
      return Object.assign(empty(), parsed);
    } catch (e) {
      return empty();
    }
  }

  var state = read();

  function save() {
    try {
      window.localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      /* 保存できない環境でもメモリ上で動作を続ける */
    }
  }

  function log(type, payload) {
    state.history.push(Object.assign({ type: type, at: Date.now() }, payload));
    if (state.history.length > HISTORY_LIMIT) {
      state.history.splice(0, state.history.length - HISTORY_LIMIT);
    }
  }

  return {
    /* ---------- バックアップ ---------- */
    /** 学習記録をまるごと文字列にする（ファイル保存・コピー用） */
    exportData: function () {
      return JSON.stringify({ app: "matome-anki", format: 1, exportedAt: new Date().toISOString(), data: state });
    },

    /** 書き出した文字列から学習記録を復元する。形式が違えば例外を投げる */
    importData: function (text) {
      var obj = JSON.parse(String(text).trim());
      if (!obj || obj.app !== "matome-anki" || !obj.data || typeof obj.data.checked !== "object") {
        throw new Error("format");
      }
      state = Object.assign(empty(), obj.data);
      save();
      return obj.exportedAt || null;
    },

    /* ---------- マイ教科書（ピックアップした用語） ---------- */
    isPicked: function (termId) {
      return Boolean(state.picks && state.picks[termId]);
    },

    setPicked: function (termId, value) {
      state.picks = state.picks || {};
      if (value) state.picks[termId] = Date.now();
      else delete state.picks[termId];
      log(value ? "term_picked" : "term_unpicked", { termId: termId });
      save();
    },

    countPicked: function (termIds) {
      var p = state.picks || {}, n = 0;
      for (var i = 0; i < termIds.length; i++) if (p[termIds[i]]) n++;
      return n;
    },

    isChecked: function (termId) {
      return Boolean(state.checked[termId]);
    },

    setChecked: function (termId, value) {
      if (value) state.checked[termId] = Date.now();
      else delete state.checked[termId];
      log(value ? "term_checked" : "term_unchecked", { termId: termId });
      save();
    },

    countChecked: function (termIds) {
      var n = 0;
      for (var i = 0; i < termIds.length; i++) if (state.checked[termIds[i]]) n++;
      return n;
    },

    completeTheme: function (themeId) {
      var t = state.themes[themeId] || { completedCount: 0 };
      t.completedAt = Date.now();
      t.completedCount = (t.completedCount || 0) + 1;
      state.themes[themeId] = t;
      log("theme_completed", { themeId: themeId });
      save();
    },

    isThemeCompleted: function (themeId) {
      return Boolean(state.themes[themeId] && state.themes[themeId].completedAt);
    },

    /** テーマの確認状態を消して最初から学習し直す（完了履歴は残す） */
    resetTheme: function (themeId, termIds) {
      termIds.forEach(function (id) {
        delete state.checked[id];
      });
      log("theme_reset", { themeId: themeId });
      save();
    },

    setLast: function (themeId, pageIndex) {
      state.last = { themeId: themeId, pageIndex: pageIndex, at: Date.now() };
      save();
    },

    getLast: function () {
      return state.last;
    },

    getCompletedCount: function (themeId) {
      return (state.themes[themeId] && state.themes[themeId].completedCount) || 0;
    },

    /* ---------- 基礎問題 ---------- */

    /** 1問ごとの解答を記録（苦手問題・正答率の元データ） */
    recordAnswer: function (termId, correct, dir) {
      state.answers = state.answers || {};
      var a = state.answers[termId] || { correct: 0, wrong: 0 };
      if (correct) a.correct++;
      else a.wrong++;
      a.last = correct;
      a.at = Date.now();
      if (dir) {
        a.dirs = a.dirs || {};
        var d = a.dirs[dir] || { c: 0, w: 0 };
        if (correct) d.c++;
        else d.w++;
        a.dirs[dir] = d;
      }
      state.answers[termId] = a;
      log("answer", { termId: termId, correct: correct, dir: dir });
      save();
    },

    /** 用語の集合について、解答済みの数と最後の解答が正解だった数 */
    answerStats: function (termIds) {
      var answers = state.answers || {};
      var answered = 0, correct = 0;
      termIds.forEach(function (id) {
        var a = answers[id];
        if (!a) return;
        answered++;
        if (a.last) correct++;
      });
      return { answered: answered, correct: correct };
    },

    /** 用語ID → { correct, wrong, last, at, dirs } */
    getAnswers: function () {
      return state.answers || {};
    },

    /* ---------- 年度別の本試験（マークシート） ---------- */
    getPast: function (yearId) {
      state.past = state.past || {};
      return state.past[yearId] || { answers: {}, graded: {} };
    },
    setPastAnswer: function (yearId, q, choice) {
      state.past = state.past || {};
      var p = state.past[yearId] || { answers: {}, graded: {} };
      p.answers[q] = choice;
      state.past[yearId] = p;
      save();
    },
    gradePast: function (yearId, subjectIndex) {
      state.past = state.past || {};
      var p = state.past[yearId] || { answers: {}, graded: {} };
      p.graded[subjectIndex] = Date.now();
      state.past[yearId] = p;
      log("past_graded", { year: yearId, subject: subjectIndex });
      save();
    },
    resetPast: function (yearId, subjectIndex, from, to) {
      state.past = state.past || {};
      var p = state.past[yearId];
      if (!p) return;
      for (var q = from; q <= to; q++) delete p.answers[q];
      delete p.graded[subjectIndex];
      save();
    },

    /* ---------- 過去問題 ---------- */
    recordExam: function (qid, correct) {
      state.exams = state.exams || {};
      var a = state.exams[qid] || { correct: 0, wrong: 0 };
      if (correct) a.correct++;
      else a.wrong++;
      a.last = correct;
      a.at = Date.now();
      if (correct) a.okAt = a.at; // 最後に正解した時刻（オリジナル問題の入れ替えに使う）
      state.exams[qid] = a;
      log("exam_answer", { qid: qid, correct: correct });
      save();
    },

    getExamAnswers: function () {
      return state.exams || {};
    },

    /** 問題の集合について、解いた数・最後の解答が正解だった数・延べの正誤 */
    examStats: function (qids) {
      var ex = state.exams || {};
      var answered = 0, correct = 0, c = 0, w = 0;
      qids.forEach(function (id) {
        var a = ex[id];
        if (!a) return;
        answered++;
        if (a.last) correct++;
        c += a.correct; w += a.wrong;
      });
      return { answered: answered, correct: correct, attempts: c + w, rate: c + w ? Math.round((c / (c + w)) * 100) : null };
    },

    saveQuizResult: function (themeId, score, total) {
      state.quiz = state.quiz || {};
      var q = state.quiz[themeId] || { count: 0, best: 0 };
      q.count++;
      q.last = score;
      q.total = total;
      q.best = Math.max(q.best || 0, Math.round((score / total) * 100));
      q.at = Date.now();
      state.quiz[themeId] = q;
      log("quiz_finished", { themeId: themeId, score: score, total: total });
      save();
    },

    getQuizResult: function (themeId) {
      return (state.quiz && state.quiz[themeId]) || null;
    },

    /** 表示モードなど、利用者ごとの設定 */
    getPref: function (key, fallback) {
      var prefs = state.prefs || {};
      return key in prefs ? prefs[key] : fallback;
    },

    setPref: function (key, value) {
      state.prefs = state.prefs || {};
      state.prefs[key] = value;
      save();
    },

    getHistory: function () {
      return state.history.slice();
    },
  };
})();

</script>
